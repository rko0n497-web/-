/* =====================================================================
   =======================  ARENA  =====================================
   ===================================================================== */

const ARENA_SPIN_MS = () => Math.max(800, Math.min(8000, state.settings.cardRules.animateDuration || 3200));

function renderArena() {
  const A = state.arena;
  const org = A.mode === 'organizer';
  $('#arena-logo').src = schoolLogo();
  $('#view-arena').classList.toggle('arena-mode-public', !org);
  $('#arena-tab-org').classList.toggle('on', org);
  $('#arena-tab-pub').classList.toggle('on', !org);

  /* Watchdog: if the state says we're spinning but the timer says we've
     exceeded the animation window + slack, resolve automatically. */
  if ((A.stage === 'spinning-team' || A.stage === 'spinning-card')
      && Date.now() - A.spinStart > ARENA_SPIN_MS() + 600) {
    A.stage = A.stage === 'spinning-team' ? 'team-result' : 'card-result';
    save(false);
  }

  const main = $('#arena-main');

  if (org) {
    main.innerHTML = renderArenaOrganizer();
  } else {
    main.innerHTML = renderArenaPublic();
  }
}

/* ---------- ORGANIZER MODE ---------- */
function renderArenaOrganizer() {
  const A = state.arena;
  const teams = activeTeams();
  const teamsHTML = arenaTeamsHTML(teams);
  const cardsHTML = arenaCardsHTML(teams);

  let stageContent = '';
  if (A.stage === 'idle') {
    stageContent = `
      <div class="arena-result">
        <div class="msg">🃏 ساحة البطاقات</div>
        <div class="sub">اختر إجراءً من الأسفل — الدور على ${esc((getTeam(A.selectedTeamId) || {}).name || 'لم يُحدد بعد')}</div>
      </div>
      ${teamsHTML}`;
  } else if (A.stage === 'spinning-team') {
    stageContent = teamsHTML;
  } else if (A.stage === 'team-result') {
    const t = getTeam(A.selectedTeamId);
    stageContent = `${teamsHTML}
      <div class="arena-result">
        <div class="msg">🎯 تم اختيار فريق: ${esc(t ? t.name : '—')}</div>
        <div class="sub">${t ? 'الآن يمكنك سحب بطاقة لهذا الفريق' : ''}</div>
      </div>`;
  } else if (A.stage === 'spinning-card') {
    stageContent = `${cardsHTML}`;
  } else if (A.stage === 'card-result') {
    const t = getTeam(A.selectedTeamId);
    const c = getCard(A.selectedCardId);
    stageContent = `${cardsHTML}
      <div class="arena-result">
        <div class="msg">🎉 ${esc(t ? t.name : '—')} حصل على بطاقة</div>
        <div class="card-preview" style="background:linear-gradient(135deg,${esc(c ? c.color : '#3b6bff')},${esc(c ? c.color : '#3b6bff')}88)">
          ${esc((c && c.emoji) || '🃏')} ${esc(c ? c.name : '—')}
        </div>
        <div class="sub">${esc(c ? c.desc : '')}</div>
      </div>`;
  } else if (A.stage === 'announcement') {
    stageContent = `
      <div class="arena-result">
        <div class="msg">${esc(A.message || '')}</div>
        <div class="sub">${esc(A.subMessage || '')}</div>
      </div>`;
  }

  return `
    <div class="arena-stage">${stageContent}</div>
    <div class="arena-controls">
      <span class="tiny muted">طريقة السحب: <b>${labelMethod(state.settings.cardRules.method)}</b></span>
      <button class="btn primary sm" onclick="App.arena.startSpinTeam()" ${isSpinning() ? 'disabled' : ''}>🎯 اختيار فريق عشوائي</button>
      <button class="btn purple sm" onclick="App.arena.startSpinCard()" ${isSpinning() ? 'disabled' : ''}>🎴 اسحب بطاقة عشوائية</button>
      <button class="btn gold sm" onclick="App.arena.startCombo()" ${isSpinning() ? 'disabled' : ''}>⚡ سحب فوري (فريق + بطاقة)</button>
      <button class="btn ghost sm" onclick="App.arena.cancelSpin()" ${isSpinning() ? '' : 'disabled'}>✕ إلغاء</button>
      <button class="btn ghost sm" onclick="App.arena.resetStage()">↺ تصفير</button>
      <div class="spacer"></div>
      <button class="btn ghost sm" onclick="App.arena.manualGrant()">＋ منح يدوي</button>
      <button class="btn ghost sm" onclick="App.arena.openHistory()">📜 سجل البطاقات</button>
    </div>
    ${renderArenaInventory(teams)}`;
}

/* ---------- PUBLIC MODE ---------- */
function renderArenaPublic() {
  const A = state.arena;
  const teams = activeTeams();
  const teamsHTML = arenaTeamsHTML(teams);
  const cardsHTML = arenaCardsHTML(teams);

  let content = '';
  if (A.stage === 'idle') {
    content = `<div class="arena-result"><div class="msg">🏟️ ساحة البطاقات التكتيكية</div>
      <div class="sub">${esc(state.event.slogan)}</div></div>`;
  } else if (A.stage === 'spinning-team') {
    content = teamsHTML;
  } else if (A.stage === 'team-result') {
    const t = getTeam(A.selectedTeamId);
    content = `${teamsHTML}
      <div class="arena-result">
        <div class="msg">🎯 تم اختيار فريق: ${esc(t ? t.name : '—')}</div>
        <div class="sub">استعدوا لسحب البطاقة</div>
      </div>`;
  } else if (A.stage === 'spinning-card') {
    content = A.hideCardDuringSpin !== false
      ? arenaCardsHTML(teams, true)
      : cardsHTML;
  } else if (A.stage === 'card-result' || A.stage === 'announcement') {
    const t = getTeam(A.selectedTeamId);
    const c = getCard(A.selectedCardId);
    content = `${cardsHTML}
      <div class="arena-result">
        <div class="msg">${c ? `🎉 ${esc(t ? t.name : '')} حصل على: ${esc(c.name)}!` : esc(A.message || '')}</div>
        ${c ? `<div class="card-preview" style="background:linear-gradient(135deg,${esc(c.color)},${esc(c.color)}88)">
          ${esc(c.emoji || '🃏')} ${esc(c.desc)}</div>` : `<div class="sub">${esc(A.subMessage || '')}</div>`}
      </div>`;
  }

  return `<div class="arena-stage">${content}</div>`;
}

/* ---------- sub-renderers ---------- */
function arenaTeamsHTML(teams) {
  const A = state.arena;
  const spinning = A.stage === 'spinning-team';
  const showingWinner = A.stage === 'team-result' || A.stage === 'card-result' || A.stage === 'announcement';
  return `
    <div class="arena-teams">
      ${teams.map(t => {
        const isWinner = showingWinner && A.selectedTeamId === t.id;
        const isSpinning = spinning && !isWinner;
        const dim = showingWinner && A.selectedTeamId !== t.id;
        return `<div class="arena-team ${isSpinning ? 'spinning' : ''} ${isWinner ? 'winner' : ''} ${dim ? 'dim' : ''}"
                     style="--tc:${esc(t.color)}">
          <img src="${esc(t.logo)}" alt="">
          <div class="n">${esc(t.name)}</div>
          <div class="sc">${t.score} نقطة</div>
        </div>`;
      }).join('')}
    </div>`;
}

function arenaCardsHTML(teams, faceDown = false) {
  const A = state.arena;
  const spinning = A.stage === 'spinning-card';
  const showingWinner = A.stage === 'card-result';
  const dim = showingWinner && A.selectedCardId !== null;

  /* show all cards regardless of supply for animation; supply check happens on draw */
  const eligibleCards = state.cards.filter(c => (state.cardSupply[c.id] || 0) > 0);
  const cardsToShow = eligibleCards.length ? eligibleCards : state.cards;

  return `
    <div class="arena-cards">
      ${cardsToShow.map(c => {
        const isWinner = showingWinner && A.selectedCardId === c.id;
        const isSpinning = spinning && !isWinner && !faceDown;
        const isDim = dim && A.selectedCardId !== c.id;
        const hideFace = faceDown && !isWinner;
        return `<div class="arena-card ${isSpinning ? 'spinning' : ''} ${isWinner ? 'winner' : ''} ${isDim ? 'dim' : ''} ${hideFace ? 'face-down' : ''}"
                     style="background:linear-gradient(160deg,${esc(c.color)}dd,${esc(c.color)}44)">
          <div class="sheen"></div>
          <div class="emoji">${esc(c.emoji || '🃏')}</div>
          <div class="acn">${esc(c.name)}</div>
          <div class="acd">${esc(c.desc)}</div>
          <div class="acf">${esc(EFFECT_LABEL[c.effect] || c.effect)}</div>
        </div>`;
      }).join('')}
    </div>`;
}

function renderArenaInventory(teams) {
  return `
    <div class="arena-inv">
      ${teams.map(t => {
        const avail = Object.entries(t.cards || {}).filter(([, n]) => n > 0);
        const used = Object.entries(t.cardsUsed || {}).filter(([, n]) => n > 0);
        return `
        <div class="arena-inv-card" style="--tc:${esc(t.color)}">
          <div class="head">
            <img src="${esc(t.logo)}" alt="">
            <div class="nm">${esc(t.name)}</div>
            <div class="cnt">${avail.reduce((a, [, n]) => a + n, 0)} 🃏</div>
          </div>
          <div class="mini-cards">
            ${avail.length ? avail.map(([cardId, n]) => {
              const c = getCard(cardId); if (!c) return '';
              return `<span class="mini-card" style="background:linear-gradient(135deg,${esc(c.color)},${esc(c.color)}88)"
                        onclick="App.arena.activateFor('${t.id}','${cardId}')"
                        title="${esc(c.desc)}">
                ${esc(c.emoji || '🃏')} ${esc(c.name)}<span class="num">×${n}</span>
              </span>`;
            }).join('') : '<span class="tiny muted">لا توجد بطاقات متاحة</span>'}
          </div>
          ${used.length ? `<div class="tiny muted" style="margin-top:.5rem">مستخدمة: ${used.map(([id, n]) => {
            const c = getCard(id); return c ? esc(c.name) + ' ×' + n : '';
          }).join(' · ')}</div>` : ''}
        </div>`;
      }).join('')}
    </div>`;
}

function isSpinning() {
  return state.arena.stage === 'spinning-team' || state.arena.stage === 'spinning-card';
}
function labelMethod(m) {
  return {
    'random-team-random-card': 'فريق عشوائي ← بطاقة عشوائية',
    'specific-team-random-card': 'فريق محدد ← بطاقة عشوائية',
    'random-card-random-team': 'بطاقة عشوائية ← فريق عشوائي'
  }[m] || m;
}

/* =====================================================================
   ARENA ACTIONS
   ===================================================================== */
const Arena = {
  setMode(mode) {
    state.arena.mode = mode;
    save(); renderArena();
    toast(mode === 'public' ? 'وضع العرض العام' : 'وضع المنظّم', 'ok');
  },

  resetStage() {
    const A = state.arena;
    A.stage = 'idle';
    A.selectedTeamId = null;
    A.selectedCardId = null;
    A.message = '';
    A.subMessage = '';
    save(); renderArena();
  },

  cancelSpin() {
    if (!isSpinning()) return;
    const A = state.arena;
    const prevTeam = A.selectedTeamId;
    const prevCard = A.selectedCardId;
    A.stage = 'idle';
    A.selectedTeamId = null;
    A.selectedCardId = null;
    save(); renderArena();
    toast('تم إلغاء السحب', 'ok');
  },

  _pickEligibleTeams() {
    return activeTeams();
  },
  _pickEligibleCards() {
    const teams = activeTeams();
    return state.cards.filter(c => {
      if ((state.cardSupply[c.id] || 0) <= 0) return false;
      /* ensure at least one team could hold it (not maxed) */
      return true;
    });
  },

  /* ---- Random team selection (animated) ---- */
  startSpinTeam() {
    if (isSpinning()) { toast('انتظر انتهاء الحركة الحالية', 'bad'); return; }
    const teams = this._pickEligibleTeams();
    if (!teams.length) { toast('لا توجد فرق مشاركة', 'bad'); return; }
    const A = state.arena;
    const winner = teams[Math.floor(Math.random() * teams.length)];
    A.stage = 'spinning-team';
    A.selectedTeamId = winner.id;
    A.selectedCardId = null;
    A.spinStart = Date.now();
    A.spinDuration = ARENA_SPIN_MS();
    A.message = '';
    save(); renderArena();
    playSound('spin');
    this._log('team-select', winner.id, null, 'اختيار فريق عشوائي');
    setTimeout(() => {
      if (state.arena.stage !== 'spinning-team') return;
      state.arena.stage = 'team-result';
      state.arena.message = `تم اختيار فريق: ${winner.name}`;
      save(); renderArena();
      playSound('win');
    }, A.spinDuration);
  },

  /* ---- Random card draw for currently-selected team (or auto-pick per method) ---- */
  startSpinCard() {
    if (isSpinning()) { toast('انتظر انتهاء الحركة الحالية', 'bad'); return; }
    const A = state.arena;
    const rules = state.settings.cardRules;
    const teams = this._pickEligibleTeams();
    const cards = this._pickEligibleCards();

    if (!cards.length) { toast('لا توجد بطاقات متاحة في المخزون', 'bad'); return; }
    if (!teams.length) { toast('لا توجد فرق مشاركة', 'bad'); return; }

    let teamId = A.selectedTeamId;
    if (!teamId) {
      if (rules.method === 'specific-team-random-card') {
        toast('اختر فريقاً أولاً', 'bad'); return;
      }
      teamId = teams[Math.floor(Math.random() * teams.length)].id;
    }
    const team = getTeam(teamId);
    if (!team) { toast('الفريق غير موجود', 'bad'); return; }

    /* enforce maxHold */
    const held = Object.values(team.cards || {}).reduce((a, b) => a + b, 0);
    if (held >= (rules.maxHold || 99)) {
      toast(`الفريق وصل للحد الأقصى (${rules.maxHold} بطاقة)`, 'bad'); return;
    }

    const card = cards[Math.floor(Math.random() * cards.length)];
    A.stage = 'spinning-card';
    A.selectedTeamId = team.id;
    A.selectedCardId = card.id;
    A.spinStart = Date.now();
    A.spinDuration = ARENA_SPIN_MS();
    A.message = '';
    save(); renderArena();
    playSound('spin');
    setTimeout(() => {
      if (state.arena.stage !== 'spinning-card') return;
      this._commitDraw(team.id, card.id);
      state.arena.stage = 'card-result';
      state.arena.message = `${team.name} حصل على بطاقة: ${card.name}`;
      save(); renderArena();
      playSound('win');
    }, A.spinDuration);
  },

  /* ---- Combo: random team then random card (single click) ---- */
  startCombo() {
    if (isSpinning()) { toast('انتظر انتهاء الحركة الحالية', 'bad'); return; }
    const teams = this._pickEligibleTeams();
    const cards = this._pickEligibleCards();
    if (!teams.length) { toast('لا توجد فرق مشاركة', 'bad'); return; }
    if (!cards.length) { toast('لا توجد بطاقات متاحة في المخزون', 'bad'); return; }

    /* Phase 1: spin team */
    const team = teams[Math.floor(Math.random() * teams.length)];
    const A = state.arena;
    A.stage = 'spinning-team';
    A.selectedTeamId = team.id;
    A.selectedCardId = null;
    A.spinStart = Date.now();
    A.spinDuration = ARENA_SPIN_MS();
    A.message = '';
    save(); renderArena();
    playSound('spin');
    this._log('team-select', team.id, null, 'اختيار فريق عشوائي (combo)');

    setTimeout(() => {
      if (state.arena.stage !== 'spinning-team') return;
      state.arena.stage = 'team-result';
      state.arena.message = `تم اختيار فريق: ${team.name}`;
      save(); renderArena();
      playSound('win');

      /* Phase 2: spin card */
      setTimeout(() => {
        if (state.arena.stage !== 'team-result') return;
        const currentCards = this._pickEligibleCards();
        if (!currentCards.length) { toast('لا توجد بطاقات متاحة', 'bad'); return; }
        const card = currentCards[Math.floor(Math.random() * currentCards.length)];
        A.stage = 'spinning-card';
        A.selectedCardId = card.id;
        A.spinStart = Date.now();
        A.spinDuration = ARENA_SPIN_MS();
        save(); renderArena();
        playSound('spin');
        setTimeout(() => {
          if (state.arena.stage !== 'spinning-card') return;
          this._commitDraw(team.id, card.id);
          state.arena.stage = 'card-result';
          state.arena.message = `${team.name} حصل على بطاقة: ${card.name}`;
          save(); renderArena();
          playSound('win');
        }, A.spinDuration);
      }, 700);
    }, A.spinDuration);
  },

  /* ---- Actual inventory mutation happens here — only once per draw ---- */
  _commitDraw(teamId, cardId) {
    const team = getTeam(teamId), card = getCard(cardId);
    if (!team || !card) return;
    team.cards = team.cards || {};
    team.cards[cardId] = (team.cards[cardId] || 0) + 1;
    state.cardSupply[cardId] = Math.max(0, (state.cardSupply[cardId] || 0) - 1);
    this._log('draw', teamId, cardId, `سحب عشوائي — ${team.name} ← ${card.name}`);
  },

  /* ---- Manual grant (organizer only) ---- */
  manualGrant() {
    const teams = activeTeams();
    if (!teams.length) { toast('لا توجد فرق', 'bad'); return; }
    openModal('منح بطاقة يدوياً', `
      <div class="field"><label>الفريق</label>
        <select class="select" id="mg-team">
          ${teams.map(t => `<option value="${t.id}">${esc(t.name)}</option>`).join('')}
        </select></div>
      <div class="field"><label>البطاقة</label>
        <select class="select" id="mg-card">
          ${state.cards.map(c => `<option value="${c.id}">${esc(c.emoji || '🃏')} ${esc(c.name)}</option>`).join('')}
        </select></div>
      <div class="field"><label>العدد</label>
        <input class="input" type="number" id="mg-count" min="1" max="20" value="1"></div>
    `, `<button class="btn primary" onclick="App.arena._doManualGrant()">＋ منح</button>
        <button class="btn ghost" onclick="App.closeModal()">إلغاء</button>`);
  },
  _doManualGrant() {
    const teamId = $('#mg-team').value;
    const cardId = $('#mg-card').value;
    const n = Math.max(1, +$('#mg-count').value || 1);
    const team = getTeam(teamId), card = getCard(cardId);
    if (!team || !card) return;
    team.cards = team.cards || {};
    team.cards[cardId] = (team.cards[cardId] || 0) + n;
    this._log('grant', teamId, cardId, `منح يدوي × ${n}`);
    save(); closeModal(); renderArena();
    toast(`تم منح ${card.name} × ${n} إلى ${team.name}`, 'ok');
  },

  /* ---- Remove unused (organizer) ---- */
  removeUnused(teamId, cardId) {
    const team = getTeam(teamId), card = getCard(cardId);
    if (!team || !card) return;
    if ((team.cards[cardId] || 0) <= 0) { toast('لا توجد نسخ متاحة', 'bad'); return; }
    confirmDialog('حذف بطاقة', `حذف نسخة واحدة من <b>${esc(card.name)}</b> من ${esc(team.name)}؟`, () => {
      team.cards[cardId] = (team.cards[cardId] || 0) - 1;
      if (team.cards[cardId] <= 0) delete team.cards[cardId];
      state.cardSupply[cardId] = (state.cardSupply[cardId] || 0) + 1;
      this._log('remove', teamId, cardId, 'حذف بطاقة يدوي');
      save(); renderArena();
      toast('تم الحذف', 'ok');
    });
  },

  /* ---- Activate a card from the arena's team inventory ---- */
  activateFor(teamId, cardId) {
    const team = getTeam(teamId), card = getCard(cardId);
    if (!team || !card) return;
    const check = canActivateCard(team, card);
    if (!check.ok) { toast(check.reason, 'bad'); return; }
    confirmDialog('تنشيط بطاقة',
      `تنشيط <b>${esc(card.name)}</b> للفريق <b>${esc(team.name)}</b>؟<br>
       <span class="tiny muted">${esc(card.desc)}</span>`,
      () => this._doActivate(teamId, cardId),
      'تنشيط', false);
  },
  _doActivate(teamId, cardId) {
    const team = getTeam(teamId), card = getCard(cardId);
    if (!team || !card) return;
    if ((team.cards[cardId] || 0) <= 0) { toast('لا توجد نسخ متاحة', 'bad'); return; }
    const res = applyCardEffect(team, card);
    team.cards[cardId] = (team.cards[cardId] || 0) - 1;
    if (team.cards[cardId] <= 0) delete team.cards[cardId];
    team.cardsUsed = team.cardsUsed || {};
    team.cardsUsed[cardId] = (team.cardsUsed[cardId] || 0) + 1;

    const L = state.live;
    L.fx = { id: uid(), type: 'card', text: `🃏 ${card.name} — ${team.name}\n${res.msg}` };
    this._log('activate', teamId, cardId, `تنشيط — ${card.name} (${res.msg})`);
    state.scoreLog.push({ id: uid(), ts: Date.now(), teamId, delta: 0,
      reason: `بطاقة: ${card.name} — ${res.msg}`, correct: 0, wrong: 0 });

    /* Optional: show an announcement on the arena for public */
    const A = state.arena;
    if (A.mode === 'public' && (A.stage === 'card-result' || A.stage === 'announcement')) {
      A.message = `${team.name} فعّل: ${card.name}`;
      A.subMessage = res.msg;
    }

    save(); renderArena();
    playSound('card');
    toast(`تم تنشيط ${card.name}${res.manual ? ' (تُطبَّق يدوياً)' : ''}`, 'ok');
  },

  /* ---- Open full card history ---- */
  openHistory() {
    const rows = state.cardHistory.slice().reverse().slice(0, 200);
    const icons = { draw: '🎴', grant: '＋', remove: '🗑', activate: '⚡', transfer: '⇄', 'team-select': '🎯' };
    openModal('سجل البطاقات',
      rows.length ? `<div class="arena-history" style="max-height:60vh">
        ${rows.map(h => {
          const t = getTeam(h.teamId), c = getCard(h.cardId);
          return `<div class="hrow"><span class="t">${new Date(h.ts).toLocaleString('ar')}</span>
            <span class="ic">${icons[h.type] || '·'}</span>
            <span class="txt"><b>${esc(t ? t.name : '—')}</b>${c ? ' · ' + esc(c.name) : ''}
              <span class="muted tiny"> — ${esc(h.note || '')}</span></span></div>`;
        }).join('')}
      </div>` : '<p class="muted">لا يوجد سجل بعد.</p>',
      `<button class="btn ghost" onclick="App.closeModal()">إغلاق</button>`,
      { width: '720px' });
  },

  /* ---- internal logging ---- */
  _log(type, teamId, cardId, note) {
    state.cardHistory.push({ id: uid(), ts: Date.now(), type, teamId, cardId, note });
    if (state.cardHistory.length > 500) state.cardHistory.splice(0, state.cardHistory.length - 500);
  }
};

const App = {

  async changeCreds() {

  exportBackup() {

  importBackup(input) {

        <div class="field"><label>القيمة</label><input class="input" type="number" id="ms-val" value="10"></div>

        </div>`, `<button class="btn ghost" onclick="App.closeModal()">إغلاق</button>`);
    },
    _applyScore(id, sign) {
      const v = Math.abs(+$('#ms-val').value || 0);
      const reason = $('#ms-reason').value.trim() || 'تعديل يدوي';
      applyScore(id, sign * v, reason);
      save(); closeModal(); render();
      toast(`تم ${sign > 0 ? 'منح' : 'خصم'} ${v}`, 'ok');
    },
    cards(id) {
      const t = getTeam(id); if (!t) return;
      openModal('بطاقات ' + t.name, `
        <div class="hint" style="margin-bottom:.9rem">اضبط عدد النسخ المتاحة لهذا الفريق لكل بطاقة.</div>
        ${state.cards.map(c => `
          <div class="row" style="padding:.5rem 0;border-bottom:1px solid var(--line)">

    _saveCards(id) {
      const t = getTeam(id); if (!t) return;
      t.cards = {};
      $$('[data-card]').forEach(inp => {
        const v = Math.max(0, +inp.value || 0);
        if (v > 0) t.cards[inp.dataset.card] = v;
      });
      save(); closeModal(); render(); toast('تم الحفظ', 'ok');
    }

  q: {
    filter() {
      const term = ($('#q-search').value || '').trim().toLowerCase();
      const cat = $('#q-fcat').value, diff = $('#q-fdiff').value;
      const rows = state.questions.map((q, i) => ({ q, i })).filter(({ q }) => {
        if (term && !(q.text || '').toLowerCase().includes(term)) return false;
        if (cat && q.category !== cat) return false;
        if (diff && q.difficulty !== diff) return false;
        return true;
      });
      const box = $('#q-list');
      if (!rows.length) { box.innerHTML = `<div class="card pad" style="text-align:center;padding:2rem"><p class="muted">لا نتائج.</p></div>`; return; }

      App.q._id = id;
      renderQEditor();
    },
    addChoice() {
      const d = App.q._draft;
      if (d.choices.length >= 6) { toast('الحد 6', 'bad'); return; }
      d.choices.push(''); renderQEditor();
    },
    removeChoice(i) {
      const d = App.q._draft;
      if (d.choices.length <= 2) { toast('الحد 2', 'bad'); return; }
      d.choices.splice(i, 1);
      if (d.correctIndex >= d.choices.length) d.correctIndex = 0;
      renderQEditor();
    },
    setCorrect(i) { App.q._draft.correctIndex = i; renderQEditor(); },
    setFormat(f) {
      App.q._draft.format = f;
      if (f === 'tf') { App.q._draft.choices = ['صح', 'خطأ']; App.q._draft.correctIndex = 0; }
      renderQEditor();
    },
    save() {
      const d = App.q._draft;
      d.text = $('#qe-text').value.trim();
      d.category = $('#qe-cat').value.trim() || 'عام';
      d.difficulty = $('#qe-diff').value;
      d.points = Math.max(1, +$('#qe-points').value || 10);
      d.timeLimit = clamp(+$('#qe-time').value || 30, 5, 600);
      if ($('#qe-correcttext')) d.correctText = $('#qe-correcttext').value.trim();
      d.explanation = $('#qe-exp').value.trim();
      $$('[data-choice]').forEach(inp => { d.choices[+inp.dataset.choice] = inp.value; });
      if (!d.text) { toast('نص السؤال مطلوب', 'bad'); return; }
      d.choices = d.choices.map(c => c.trim());
      if (App.q._id) Object.assign(getQuestion(App.q._id), d);
      else state.questions.push(Object.assign({ id: uid() }, d));
      save(); closeModal(); render(); toast('تم حفظ السؤال', 'ok');
    },
    dup(id) {
      const q = getQuestion(id); if (!q) return;
      const copy = JSON.parse(JSON.stringify(q)); copy.id = uid();
      const i = state.questions.findIndex(x => x.id === id);
      state.questions.splice(i + 1, 0, copy);
      save(); render(); toast('تم التكرار', 'ok');
    },
    del(id) {
      const q = getQuestion(id); if (!q) return;
      confirmDialog('حذف سؤال', `حذف «${esc(q.text.slice(0, 60))}»؟`, () => {
        state.questions = state.questions.filter(x => x.id !== id);
        if (state.live.questionId === id) { state.live.questionId = null; state.live.status = 'idle'; }
        save(); render(); toast('تم الحذف', 'ok');
      });
    },
    move(id, dir) {
      const i = state.questions.findIndex(q => q.id === id), j = i + dir;
      if (i < 0 || j < 0 || j >= state.questions.length) return;
      const [m] = state.questions.splice(i, 1);
      state.questions.splice(j, 0, m);
      save(); render();
    },
    preview(id) {
      const q = getQuestion(id); if (!q) return;
      openModal('معاينة', `<div class="qtext">${esc(q.text)}</div>
        <div class="choices">${(q.choices || []).map((c, i) =>
          `<div class="choice ${i === q.correctIndex ? 'correct' : ''}"><span class="k">${i + 1}</span><span>${esc(c)}</span></div>`).join('')}</div>`,
        `<button class="btn ghost" onclick="App.closeModal()">إغلاق</button>`);
    },
    exportJSON() {
      const blob = new Blob([JSON.stringify(state.questions, null, 2)], { type: 'application/json' });
      const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
      a.download = 'brainclash-questions.json'; a.click();
      setTimeout(() => URL.revokeObjectURL(a.href), 1500);
      toast('تم التصدير', 'ok');
    },
    importJSON() {
      openModal('استيراد أسئلة', `<input type="file" accept="application/json,.json" id="q-import-file" class="input">`,
        `<button class="btn primary" onclick="App.q._doImport()">⬆️ استيراد</button>
         <button class="btn ghost" onclick="App.closeModal()">إلغاء</button>`);
    },
    _doImport() {
      const f = $('#q-import-file').files[0];
      if (!f) { toast('اختر ملفاً', 'bad'); return; }
      const r = new FileReader();
      r.onload = () => {
        try {
          const arr = JSON.parse(r.result);
          if (!Array.isArray(arr)) throw new Error('صيغة غير صحيحة');
          let n = 0;
          arr.forEach(q => { if (q && q.text) { state.questions.push(Object.assign({id: uid()}, q)); n++; } });
          save(); closeModal(); render(); toast(`تم استيراد ${n}`, 'ok');
        } catch (e) { toast('خطأ: ' + e.message, 'bad'); }
      };
      r.readAsText(f);
    }
  },

        <div class="field"><label>قيمة التأثير (ثوانٍ/نقاط)</label>
          <input class="input" type="number" id="ce-value" min="0" value="${d.value || 0}"></div>
      `, `<button class="btn primary" onclick="App.cards._save('${id || ''}')">💾 حفظ</button>
          <button class="btn ghost" onclick="App.closeModal()">إلغاء</button>`, { width: '620px' });
    },
    _save(id) {
      const name = $('#ce-name').value.trim();
      if (!name) { toast('الاسم مطلوب', 'bad'); return; }
      const data = {
        name, desc: $('#ce-desc').value.trim(), color: $('#ce-color').value,
        emoji: $('#ce-emoji').value.trim() || '🃏',
        uses: clamp(+$('#ce-uses').value || 1, 1, 99),
        effect: $('#ce-effect').value,
        value: Math.max(0, +$('#ce-value').value || 0)
      };
      if (id) Object.assign(getCard(id), data);
      else state.cards.push(Object.assign({ id: uid(), confirm: true }, data));
      ensureCardSupply();
      save(); closeModal(); render(); toast('تم الحفظ', 'ok');
    },
    replenish(id) {
      const c = getCard(id); if (!c) return;
      state.cardSupply[id] = (state.cardSupply[id] || 0) + (c.uses || 1) * activeTeams().length;
      save(); render(); toast('تمت إعادة التزويد', 'ok');
    },
    del(id) {
      const c = getCard(id); if (!c) return;
      confirmDialog('حذف بطاقة', `حذف <b>${esc(c.name)}</b> من كل الفرق؟`, () => {
        state.cards = state.cards.filter(x => x.id !== id);
        state.teams.forEach(t => { if (t.cards) delete t.cards[id]; if (t.cardsUsed) delete t.cardsUsed[id]; });
        delete state.cardSupply[id];
        save(); render(); toast('تم الحذف', 'ok');
      });
    }
  },

  live: {
    pickTeam(id) {
      const L = state.live;
      if (L.answerLocked) { toast('لا يمكن التغيير بعد الإجابة', 'bad'); return; }
      L.teamId = L.teamId === id ? null : id;
      save(); render();
    },
    startQuestion() {
      const q = currentQuestion() || state.questions[0];
      if (!q) { toast('أضف أسئلة أولاً', 'bad'); return; }
      if (state.live.questionId !== q.id) state.live.questionId = q.id;
      this._beginQuestion(q);
    },
    _beginQuestion(q) {
      const L = state.live;
      L.status = 'question';
      L.revealed = false; L.hiddenChoices = [];
      L.selectedChoice = null; L.selectedTeamId = null;
      L.answerLocked = false; L.answerTs = null;
      L.timeUp = false; L.scored = false; L.firstResponder = null;
      L.timer.total = q.timeLimit;
      resetTimer(q.timeLimit);
      startTimer();
      playSound('start');
      save(); render();
      toast('بدأ السؤال — المؤقت يعمل', 'ok');
    },
    countdown() {
      let n = 3;
      state.live.countdown = n;
      save(); render();
      playSound('tick');
      const iv = setInterval(() => {
        n--; state.live.countdown = n;
        if (n > 0) playSound('tick');
        save(); render();
        if (n <= 0) {
          clearInterval(iv);
          setTimeout(() => {
            state.live.countdown = 0;
            const q = currentQuestion();
            if (q) this._beginQuestion(q);
            else { state.live.status = 'question'; save(); render(); }
          }, 700);
        }
      }, 1000);
    },
    next() {
      const i = state.questions.findIndex(q => q.id === state.live.questionId);
      if (i < 0 || !state.questions[i + 1]) { toast('آخر سؤال', 'bad'); return; }
      this._beginQuestion(state.questions[i + 1]);
    },
    prev() {
      const i = state.questions.findIndex(q => q.id === state.live.questionId);
      if (i <= 0) { toast('أول سؤال', 'bad'); return; }
      this._beginQuestion(state.questions[i - 1]);
    },
    random() {
      if (!state.questions.length) { toast('لا أسئلة', 'bad'); return; }
      const pool = state.questions.filter(q => q.id !== state.live.questionId);
      const pick = (pool.length ? pool : state.questions)[Math.floor(Math.random() * (pool.length || state.questions.length))];
      this._beginQuestion(pick);
    },
    skip() {
      state.live.revealed = true;
      state.live.fx = { id: uid(), type: 'wrong', text: '⏭ تم التخطي' };
      playSound('wrong'); save(); render();
    },
    reveal() { state.live.revealed = !state.live.revealed; save(); render(); },
    organizerSelect(i) {
      if (state.live.answerLocked) { toast('تم تسجيل الإجابة', 'bad'); return; }
      if (!state.live.teamId) { toast('اختر فريقاً', 'bad'); return; }
      recordAnswer(i, 'organizer');
    },
    clearSelection() {
      if (state.live.scored) { toast('لا يمكن المسح بعد الاحتساب', 'bad'); return; }
      state.live.selectedChoice = null;
      state.live.selectedTeamId = null;
      state.live.answerLocked = false;
      state.live.answerTs = null;
      save(); render();
    },
    toggleTimer() {
      const t = state.live.timer;
      if (t.running) { pauseTimer(); toast('تم الإيقاف'); }
      else { if (t.remaining <= 0) resetTimer(currentQuestion() ? currentQuestion().timeLimit : state.settings.timerDefault); startTimer(); }
      save(); render();
    },
    resetTimer() {
      const q = currentQuestion();
      resetTimer(q ? q.timeLimit : state.settings.timerDefault);
      save(); render();
    },
    addTime(sec) { addTime(sec); save(); render(); toast(`+${sec}ث`, 'ok'); },
    correct() {
      const L = state.live, q = currentQuestion();
      if (!q || L.scored) { toast('لا يمكن التكرار', 'bad'); return; }
      const t = getTeam(L.selectedTeamId || L.teamId);
      if (!t) { toast('اختر الفريق', 'bad'); return; }
      let pts = (q.points || 10) + (q.bonus || 0);
      let doubled = false;
      if (L.doubleTeam === t.id) { pts *= 2; doubled = true; L.doubleTeam = null; }
      applyScore(t.id, pts, 'إجابة صحيحة: ' + (q.text || '').slice(0, 45), { correct: 1 });
      L.revealed = true; L.scored = true; L.answerLocked = true;
      L.timer.running = false;
      L.fx = { id: uid(), type: 'correct', text: `+${pts} — ${t.name}${doubled ? ' ✖️2' : ''}` };
      playSound('correct'); save(); render();
    },
    wrong() {
      const L = state.live, q = currentQuestion();
      if (!q || L.scored) { toast('لا يمكن التكرار', 'bad'); return; }
      const t = getTeam(L.selectedTeamId || L.teamId);
      if (!t) { toast('اختر الفريق', 'bad'); return; }
      const pen = q.penalty || 0;
      if (L.shieldTeams.includes(t.id)) {
        L.shieldTeams = L.shieldTeams.filter(id => id !== t.id);
        L.fx = { id: uid(), type: 'card', text: `🛡️ درع النقاط حمى ${t.name}` };
        L.scored = true; L.revealed = true;
        save(); playSound('card'); render(); return;
      }
      if (pen > 0) applyScore(t.id, -pen, 'إجابة خاطئة', { wrong: 1 });
      else { t.wrong += 1; state.scoreLog.push({ id: uid(), ts: Date.now(), teamId: t.id, delta: 0,
        reason: 'إجابة خاطئة', correct: 0, wrong: 1 }); }
      L.revealed = true; L.scored = true; L.answerLocked = true;
      L.timer.running = false;
      L.fx = { id: uid(), type: 'wrong', text: pen > 0 ? `-${pen}` : '✗' };
      playSound('wrong'); save(); render();
    },
    undo() { undoScore(); },
    nextRound() {
      const L = state.live;
      L.round += 1;
      L.revealed = false; L.hiddenChoices = [];
      L.selectedChoice = null; L.selectedTeamId = null;
      L.answerLocked = false; L.timeUp = false; L.scored = false;
      resetTimer(0);
      save(); render();
      toast(`بدأت الجولة ${L.round}`, 'ok');
    },
    finish() {
      if (!activeTeams().length) { toast('لا فرق', 'bad'); return; }
      confirmDialog('إنهاء المسابقة', 'تسجيل النتائج النهائية؟', () => {
        const standings = sortedTeams().map(t => ({
          name: t.name, score: t.score, correct: t.correct, wrong: t.wrong, logo: t.logo, color: t.color
        }));
        state.live.status = 'finished';
        state.live.timer.running = false;
        state.history.push({ id: uid(), ts: Date.now(),
          title: state.event.title + ' — ' + new Date().toLocaleDateString('ar'), standings });
        playSound('win'); save(); render();
        toast('انتهت المسابقة 🏆', 'gold');
      }, 'إنهاء', false);
    }
  }
};

/* =====================================================================
   QUESTION EDITOR (dynamic)
   ===================================================================== */
function renderChoicesHTML() {
  const d = App.q._draft;
  if (d.format === 'open' || d.format === 'quick') return '';
  return `
    <div class="field"><label>الخيارات (اختر الصحيح)</label>
      ${d.choices.map((c, i) => `
        <div class="row" style="margin-bottom:.45rem">
          <input type="radio" name="qcorrect" ${d.correctIndex === i ? 'checked' : ''}
                 onchange="App.q.setCorrect(${i})" style="width:20px;height:20px;accent-color:#22e08a;cursor:pointer">
          <input class="input" data-choice="${i}" value="${esc(c)}" style="flex:1">
          <button class="btn xs bad" onclick="App.q.removeChoice(${i})">✕</button>
        </div>`).join('')}
      <button class="btn ghost sm" onclick="App.q.addChoice()">＋ إضافة خيار</button>
    </div>`;
}
function renderQEditor() {
  const d = App.q._draft;
  const needCT = d.format === 'open' || d.format === 'quick';
  openModal(App.q._id ? 'تعديل السؤال' : 'سؤال جديد', `
    <div class="field"><label>نص السؤال</label>
      <textarea class="textarea" id="qe-text">${esc(d.text)}</textarea></div>
    <div class="row">
      <div class="field" style="flex:1"><label>النوع</label>
        <select class="select" id="qe-format" onchange="App.q.setFormat(this.value)">
          ${Object.entries(FORMAT_LABEL).map(([k, v]) =>
            `<option value="${k}" ${d.format === k ? 'selected' : ''}>${v}</option>`).join('')}
        </select></div>
      <div class="field" style="flex:1"><label>المستوى</label>
        <select class="select" id="qe-diff">
          <option value="easy" ${d.difficulty === 'easy' ? 'selected' : ''}>سهل</option>
          <option value="medium" ${d.difficulty === 'medium' ? 'selected' : ''}>متوسط</option>
          <option value="hard" ${d.difficulty === 'hard' ? 'selected' : ''}>صعب</option>
        </select></div>
      <div class="field" style="flex:1"><label>التصنيف</label>
        <input class="input" id="qe-cat" value="${esc(d.category)}"></div>
    </div>
    <div class="row">
      <div class="field" style="flex:1"><label>النقاط</label>
        <input class="input" type="number" id="qe-points" value="${d.points}"></div>
      <div class="field" style="flex:1"><label>المدة</label>
        <input class="input" type="number" id="qe-time" value="${d.timeLimit}"></div>
    </div>
    ${needCT ? `<div class="field"><label>الإجابة الصحيحة</label>
      <input class="input" id="qe-correcttext" value="${esc(d.correctText)}"></div>` : ''}
    ${renderChoicesHTML()}
    <div class="field"><label>الشرح</label>
      <textarea class="textarea" id="qe-exp" style="min-height:60px">${esc(d.explanation)}</textarea></div>
  `, `<button class="btn primary" onclick="App.q.save()">💾 حفظ</button>
      <button class="btn ghost" onclick="App.closeModal()">إلغاء</button>`, { width: '700px' });
}

/* =====================================================================
   KEYBOARD
   ===================================================================== */
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    if ($('#modal-root').classList.contains('on')) { closeModal(); return; }
    if (document.fullscreenElement) document.exitFullscreen();
  }
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  if (e.code === 'Space' && currentRoute().startsWith('#/dash/live')) {
    e.preventDefault();
    App.live.toggleTimer();
  }
});

/* =====================================================================
   BOOT
   ===================================================================== */
(async function boot() {
  const loaded = loadState();
  if (loaded) {
    state = loaded;
    if (!state.auth.passHash) { state.auth.passHash = await sha256(SALT + '1234'); save(false); }
  } else {
    state = defaultState();
    state.auth.passHash = await sha256(SALT + '1234');
    ensureCardMaps(); ensureCardRules(); ensureCardSupply();
    save(false);
  }
  if (!location.hash) location.hash = '#/';
  render();
  if (!storageOK) {
    setTimeout(() => toast('تحذير: التخزين المحلي لا يعمل — البيانات لن تُحفظ', 'bad'), 800);
  }
})();
</script>

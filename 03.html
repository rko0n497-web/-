<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>صراع الأدمغة — Brain Clash</title>
<meta name="description" content="صراع الأدمغة — منصة مسابقات تفاعلية لثانوية الشيخ عبدالعزيز بن باز">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#04060f; --bg2:#080e22; --panel:#0b1330; --panel2:#101a3f;
  --line:rgba(90,150,255,.22); --line2:rgba(120,190,255,.42);
  --cyan:#28e0ff; --blue:#3b6bff; --purple:#a855f7; --gold:#ffc53d;
  --ok:#22e08a; --bad:#ff4d6d; --warn:#ff9f43;
  --txt:#e8eeff; --muted:#8fa1c9;
  --r:18px; --r2:14px;
  --shadow:0 18px 50px rgba(0,0,0,.55);
  --glow:0 0 0 1px rgba(40,224,255,.25), 0 0 32px rgba(40,224,255,.14);
  --font:'Cairo','Tajawal',system-ui,-apple-system,'Segoe UI',Tahoma,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);background:var(--bg);color:var(--txt);min-height:100vh;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  background-image:
    radial-gradient(1100px 620px at 85% -10%, rgba(59,107,255,.20), transparent 65%),
    radial-gradient(900px 560px at 8% 105%, rgba(168,85,247,.16), transparent 65%),
    radial-gradient(700px 500px at 50% 50%, rgba(40,224,255,.05), transparent 70%);
  background-attachment:fixed;}
body::before{content:'';position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.35;
  background-image:linear-gradient(rgba(90,150,255,.06) 1px, transparent 1px),
                   linear-gradient(90deg, rgba(90,150,255,.06) 1px, transparent 1px);
  background-size:64px 64px;mask-image:radial-gradient(circle at 50% 40%, #000 30%, transparent 78%);
  -webkit-mask-image:radial-gradient(circle at 50% 40%, #000 30%, transparent 78%);}
.view{display:none;position:relative;z-index:1;min-height:100vh}
.view.active{display:block}
img{max-width:100%;display:block}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--cyan);text-decoration:none}
::selection{background:rgba(40,224,255,.3)}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:#070c1c}
::-webkit-scrollbar-thumb{background:#1e2d5c;border-radius:8px}
::-webkit-scrollbar-thumb:hover{background:#2d438a}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55rem;
  padding:.72rem 1.35rem;border-radius:12px;border:1px solid var(--line2);
  background:linear-gradient(180deg,rgba(59,107,255,.22),rgba(59,107,255,.08));
  color:#dbe7ff;font-weight:700;cursor:pointer;transition:.18s;white-space:nowrap;font-size:.95rem;user-select:none;}
.btn:hover{transform:translateY(-2px);border-color:var(--cyan);box-shadow:var(--glow)}
.btn:active{transform:translateY(0)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}
.btn.primary{background:linear-gradient(135deg,#3b6bff,#28e0ff);border:none;color:#031024;font-weight:900}
.btn.primary:hover{box-shadow:0 0 34px rgba(40,224,255,.55)}
.btn.gold{background:linear-gradient(135deg,#ffb01f,#ffd977);border:none;color:#231400;font-weight:900}
.btn.ok{background:linear-gradient(135deg,#17b96b,#22e08a);border:none;color:#03180e;font-weight:900}
.btn.bad{background:linear-gradient(135deg,#c92c47,#ff4d6d);border:none;color:#fff;font-weight:900}
.btn.purple{background:linear-gradient(135deg,#7c3aed,#a855f7);border:none;color:#fff;font-weight:900}
.btn.ghost{background:rgba(255,255,255,.03);border-color:var(--line)}
.btn.sm{padding:.45rem .8rem;font-size:.82rem;border-radius:10px}
.btn.xs{padding:.3rem .6rem;font-size:.75rem;border-radius:8px}
.btn.block{width:100%}
.btn.icon{padding:.5rem;width:38px;height:38px}

.card{background:linear-gradient(180deg,rgba(16,26,63,.92),rgba(9,15,38,.95));
  border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
.pad{padding:1.15rem 1.3rem}
.grid{display:grid;gap:1rem}
.row{display:flex;gap:.6rem;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.muted{color:var(--muted)}
.tiny{font-size:.78rem}
.sm-t{font-size:.88rem}
h1,h2,h3,h4{line-height:1.3}
h2{font-size:1.35rem;font-weight:900}
h3{font-size:1.1rem;font-weight:800}
hr{border:none;border-top:1px solid var(--line);margin:1rem 0}

.field{display:flex;flex-direction:column;gap:.4rem;margin-bottom:.85rem}
.field > label{font-size:.85rem;font-weight:700;color:#b9c9ee}
.input,.select,.textarea{width:100%;padding:.68rem .85rem;border-radius:11px;background:#070d20;
  border:1px solid var(--line);color:var(--txt);outline:none;transition:.15s;font-size:.95rem;}
.input:focus,.select:focus,.textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 3px rgba(40,224,255,.12)}
.textarea{min-height:88px;resize:vertical;line-height:1.7}
.select{cursor:pointer}
input[type=file]{padding:.45rem;font-size:.82rem}
input[type=color]{height:44px;padding:3px;cursor:pointer}
.check{display:flex;align-items:center;gap:.5rem;cursor:pointer;font-size:.9rem;user-select:none}
.check input{width:18px;height:18px;accent-color:var(--cyan);cursor:pointer}

.badge{display:inline-flex;align-items:center;gap:.35rem;padding:.22rem .6rem;border-radius:999px;
  font-size:.74rem;font-weight:800;background:rgba(59,107,255,.16);border:1px solid var(--line2);color:#bcd4ff}
.badge.ok{background:rgba(34,224,138,.14);border-color:rgba(34,224,138,.45);color:#7bf0b8}
.badge.bad{background:rgba(255,77,109,.14);border-color:rgba(255,77,109,.45);color:#ffa1b1}
.badge.gold{background:rgba(255,197,61,.14);border-color:rgba(255,197,61,.45);color:#ffdf9a}
.badge.purple{background:rgba(168,85,247,.16);border-color:rgba(168,85,247,.45);color:#d8b4fe}

/* ============ HOME ============ */
.home-wrap{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:2rem 1.2rem;text-align:center;position:relative}
.logo-main{width:132px;height:132px;object-fit:contain;border-radius:50%;
  background:radial-gradient(circle,rgba(40,224,255,.16),transparent 70%);padding:8px;
  filter:drop-shadow(0 0 26px rgba(40,224,255,.5));animation:floaty 5s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-11px)}}
.school-name{font-size:1.02rem;letter-spacing:.5px;color:#9fb4dd;margin-top:.7rem;font-weight:700}
.hero-title{font-size:clamp(2.6rem,8.5vw,6rem);font-weight:900;letter-spacing:-1px;line-height:1.05;margin:.45rem 0 .2rem;
  background:linear-gradient(180deg,#ffffff 12%,#7fd4ff 45%,#3b6bff 78%,#a855f7 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 34px rgba(59,107,255,.55));position:relative;}
.hero-sub{font-size:clamp(.95rem,2vw,1.25rem);color:#8fd8ff;letter-spacing:6px;font-weight:700;opacity:.9}
.slogan{margin:1.55rem auto .4rem;display:inline-block;padding:.85rem 1.9rem;border-radius:999px;
  font-size:clamp(1rem,2.4vw,1.55rem);font-weight:900;color:#ffe9a8;
  background:linear-gradient(90deg,rgba(255,197,61,.10),rgba(255,197,61,.22),rgba(255,197,61,.10));
  border:1px solid rgba(255,197,61,.5);
  box-shadow:0 0 40px rgba(255,197,61,.20), inset 0 0 24px rgba(255,197,61,.08);
  animation:sloganPulse 3.4s ease-in-out infinite;}
@keyframes sloganPulse{0%,100%{box-shadow:0 0 30px rgba(255,197,61,.18), inset 0 0 20px rgba(255,197,61,.06)}
  50%{box-shadow:0 0 62px rgba(255,197,61,.42), inset 0 0 30px rgba(255,197,61,.14)}}
.hero-actions{display:flex;gap:.85rem;flex-wrap:wrap;justify-content:center;margin-top:1.7rem}
.hero-actions .btn{padding:1rem 2.2rem;font-size:1.06rem}
.hero-meta{margin-top:2.4rem;display:flex;gap:1.9rem;flex-wrap:wrap;justify-content:center;color:#7d90ba;font-size:.85rem}
.hero-meta b{color:#c9dbff}
.teams-strip{display:flex;gap:.75rem;flex-wrap:wrap;justify-content:center;margin-top:2.4rem;max-width:1000px}
.mini-team{display:flex;align-items:center;gap:.5rem;padding:.4rem .85rem .4rem .45rem;border-radius:999px;
  background:rgba(12,20,48,.85);border:1px solid var(--line);font-size:.82rem;font-weight:700}
.mini-team img{width:30px;height:30px;border-radius:50%;object-fit:cover}

/* ============ LOGIN ============ */
.login-wrap{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:1.2rem}
.login-box{width:100%;max-width:430px;padding:2.1rem 1.9rem}
.login-box .logo-main{width:88px;height:88px;margin:0 auto 1rem}
.err{color:#ff8fa3;font-size:.85rem;font-weight:700;min-height:1.2em;text-align:center}

/* ============ DASHBOARD ============ */
.topbar{display:flex;align-items:center;gap:1rem;padding:.8rem 1.3rem;
  background:rgba(7,12,30,.92);border-bottom:1px solid var(--line);
  position:sticky;top:0;z-index:50;backdrop-filter:blur(14px);flex-wrap:wrap;}
.topbar img{width:46px;height:46px;border-radius:50%;object-fit:contain;background:#0b1330;padding:3px;
  border:1px solid var(--line2)}
.topbar .ttl{font-weight:900;font-size:1.08rem;line-height:1.2}
.topbar .ttl small{display:block;font-weight:600;font-size:.72rem;color:var(--muted);letter-spacing:2px}
.dash{display:grid;grid-template-columns:236px 1fr;gap:0;min-height:calc(100vh - 66px)}
.side{background:rgba(6,11,28,.72);border-left:1px solid var(--line);padding:1rem .7rem;
  display:flex;flex-direction:column;gap:.3rem;position:sticky;top:66px;height:calc(100vh - 66px);overflow-y:auto}
.side a{display:flex;align-items:center;gap:.6rem;padding:.62rem .8rem;border-radius:11px;
  color:#9fb0d6;font-weight:700;font-size:.9rem;transition:.15s;border:1px solid transparent}
.side a:hover{background:rgba(59,107,255,.12);color:#dbe7ff}
.side a.on{background:linear-gradient(90deg,rgba(40,224,255,.20),rgba(59,107,255,.06));
  color:#fff;border-color:var(--line2);box-shadow:inset 3px 0 0 var(--cyan)}
.side .ico{font-size:1.05rem;width:22px;text-align:center}
.dash main{padding:1.3rem;overflow-x:hidden}
.panel-title{display:flex;align-items:center;gap:.7rem;margin-bottom:1rem;flex-wrap:wrap}
.panel-title h2{font-size:1.28rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:.85rem}
.stat{padding:.95rem 1rem;border-radius:var(--r2);background:linear-gradient(180deg,rgba(16,26,63,.9),rgba(9,15,38,.95));
  border:1px solid var(--line);position:relative;overflow:hidden}
.stat::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 100% 0%,rgba(40,224,255,.12),transparent 60%)}
.stat .k{font-size:.76rem;color:var(--muted);font-weight:700;position:relative;z-index:1}
.stat .v{font-size:1.75rem;font-weight:900;color:#fff;position:relative;z-index:1;line-height:1.2}
.stat .v.cy{color:var(--cyan)} .stat .v.gd{color:var(--gold)} .stat .v.pu{color:var(--purple)}

.teams-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(238px,1fr));gap:1rem}
.team-card{border-radius:var(--r);border:1px solid var(--line);padding:1rem;position:relative;overflow:hidden;
  background:linear-gradient(180deg,rgba(16,26,63,.92),rgba(8,13,34,.96));transition:.2s}
.team-card:hover{border-color:var(--line2);transform:translateY(-3px);box-shadow:0 16px 40px rgba(0,0,0,.5)}
.team-card .glow{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% -20%, var(--tc,#3b6bff)44, transparent 65%);opacity:.22}
.team-card .head{display:flex;align-items:center;gap:.7rem;position:relative;z-index:1}
.team-card img{width:54px;height:54px;border-radius:50%;object-fit:cover;border:2px solid var(--tc,#3b6bff);
  box-shadow:0 0 18px var(--tc,#3b6bff)55;background:#08102a}
.team-card .nm{font-weight:900;font-size:1.02rem;line-height:1.25}
.team-card .sc{font-size:1.6rem;font-weight:900;color:var(--gold);line-height:1}
.team-card .mem{font-size:.75rem;color:var(--muted);margin-top:.5rem;line-height:1.6;min-height:1.9em;
  position:relative;z-index:1;word-break:break-word}
.team-card .foot{display:flex;gap:.35rem;margin-top:.7rem;position:relative;z-index:1;flex-wrap:wrap}

.qrow{display:flex;align-items:center;gap:.8rem;padding:.75rem .9rem;border-radius:13px;
  background:rgba(12,20,48,.7);border:1px solid var(--line);margin-bottom:.55rem;transition:.15s}
.qrow:hover{border-color:var(--line2);background:rgba(16,26,63,.85)}
.qrow.drag{opacity:.4}
.qrow .idx{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;font-weight:900;
  background:rgba(59,107,255,.18);border:1px solid var(--line2);font-size:.82rem;flex-shrink:0}
.qrow .txt{flex:1;min-width:0}
.qrow .txt .t{font-weight:700;font-size:.93rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow .txt .m{font-size:.72rem;color:var(--muted);margin-top:.15rem;display:flex;gap:.5rem;flex-wrap:wrap}
.qrow .acts{display:flex;gap:.3rem;flex-shrink:0}

.cards-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:1rem}
.tcard{border-radius:16px;padding:1rem;position:relative;overflow:hidden;min-height:168px;
  display:flex;flex-direction:column;border:1px solid rgba(255,255,255,.14)}
.tcard .sheen{position:absolute;inset:0;background:linear-gradient(140deg,rgba(255,255,255,.20),transparent 45%);pointer-events:none}
.tcard .cn{font-weight:900;font-size:1.02rem;position:relative;z-index:1}
.tcard .cd{font-size:.78rem;opacity:.92;margin-top:.35rem;flex:1;position:relative;z-index:1;line-height:1.55}
.tcard .cf{display:flex;justify-content:space-between;align-items:center;margin-top:.6rem;position:relative;z-index:1;
  font-size:.72rem;font-weight:800}

.live-grid{display:grid;grid-template-columns:1.35fr .9fr;gap:1rem;align-items:start}
@media(max-width:1080px){.live-grid{grid-template-columns:1fr}}
.qbox{padding:1.1rem;border-radius:var(--r);border:1px solid var(--line2);
  background:linear-gradient(180deg,rgba(16,26,63,.95),rgba(8,13,34,.98));min-height:150px}
.qbox .qtext{font-size:1.22rem;font-weight:800;line-height:1.7}
.choices{display:grid;gap:.5rem;margin-top:.9rem}
.choice{padding:.6rem .9rem;border-radius:11px;border:1px solid var(--line);background:rgba(8,14,34,.85);
  font-weight:700;font-size:.92rem;display:flex;gap:.6rem;align-items:center;transition:.15s;cursor:pointer}
.choice:hover{border-color:var(--line2);background:rgba(16,26,63,.9)}
.choice .k{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:.75rem;
  background:rgba(59,107,255,.2);border:1px solid var(--line2);flex-shrink:0}
.choice.correct{border-color:rgba(34,224,138,.7);background:rgba(34,224,138,.14)}
.choice.correct .k{background:rgba(34,224,138,.35)}
.choice.hidden{opacity:.28;text-decoration:line-through;pointer-events:none}
.choice.selected{border-color:var(--gold);background:rgba(255,197,61,.16);box-shadow:0 0 16px rgba(255,197,61,.35)}
.choice.selected .k{background:rgba(255,197,61,.35)}
.choice.locked{cursor:not-allowed}

.team-chips{display:flex;gap:.45rem;flex-wrap:wrap;margin-top:.4rem}
.tchip{display:flex;align-items:center;gap:.45rem;padding:.35rem .7rem .35rem .4rem;border-radius:999px;
  border:1px solid var(--line);background:rgba(10,17,42,.9);cursor:pointer;font-size:.84rem;font-weight:700;transition:.15s}
.tchip:hover{border-color:var(--line2)}
.tchip.on{border-color:var(--cyan);background:rgba(40,224,255,.16);box-shadow:0 0 18px rgba(40,224,255,.28)}
.tchip img{width:26px;height:26px;border-radius:50%;object-fit:cover}
.timer-big{font-size:2.5rem;font-weight:900;font-variant-numeric:tabular-nums;color:var(--cyan);
  text-shadow:0 0 26px rgba(40,224,255,.55);text-align:center;line-height:1}
.timer-big.warn{color:var(--bad);text-shadow:0 0 26px rgba(255,77,109,.6)}
.bar{height:9px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:.6rem}
.bar > i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--cyan),var(--blue));
  transition:width .25s linear;box-shadow:0 0 14px rgba(40,224,255,.55)}

table{width:100%;border-collapse:collapse;font-size:.9rem}
th,td{padding:.6rem .7rem;text-align:right;border-bottom:1px solid var(--line)}
th{font-size:.76rem;color:var(--muted);font-weight:800;letter-spacing:.4px}
tbody tr:hover{background:rgba(59,107,255,.07)}
.rank{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font-weight:900;
  background:rgba(59,107,255,.16);border:1px solid var(--line2);font-size:.85rem}
.rank.g1{background:linear-gradient(135deg,#ffb01f,#ffe08a);color:#2a1a00;border:none;box-shadow:0 0 20px rgba(255,197,61,.5)}
.rank.g2{background:linear-gradient(135deg,#c8d4e8,#eef3ff);color:#1a2437;border:none}
.rank.g3{background:linear-gradient(135deg,#b9722f,#e0a166);color:#2a1400;border:none}

.modal-backdrop{position:fixed;inset:0;background:rgba(2,4,12,.82);backdrop-filter:blur(7px);
  display:none;align-items:flex-start;justify-content:center;z-index:900;padding:1.5rem 1rem;overflow-y:auto}
.modal-backdrop.on{display:flex}
.modal{width:100%;max-width:660px;background:linear-gradient(180deg,#0d1636,#080e24);
  border:1px solid var(--line2);border-radius:20px;box-shadow:0 30px 90px rgba(0,0,0,.75);
  animation:modalIn .22s ease-out;margin:auto 0}
@keyframes modalIn{from{opacity:0;transform:translateY(16px) scale(.98)}to{opacity:1;transform:none}}
.modal .mh{display:flex;align-items:center;gap:.7rem;padding:1rem 1.2rem;border-bottom:1px solid var(--line)}
.modal .mh h3{flex:1;font-size:1.08rem}
.modal .mb{padding:1.2rem;max-height:min(70vh,700px);overflow-y:auto}
.modal .mf{padding:.9rem 1.2rem;border-top:1px solid var(--line);display:flex;gap:.6rem;justify-content:flex-start;flex-wrap:wrap}

#toast{position:fixed;bottom:1.4rem;left:50%;transform:translateX(-50%) translateY(120px);z-index:2000;
  display:flex;flex-direction:column;gap:.5rem;align-items:center;transition:.3s;pointer-events:none}
#toast.show{transform:translateX(-50%) translateY(0)}
.toast-item{padding:.72rem 1.3rem;border-radius:12px;font-weight:800;font-size:.9rem;
  background:rgba(16,26,63,.97);border:1px solid var(--line2);box-shadow:var(--shadow);color:#dbe7ff}
.toast-item.bad{border-color:rgba(255,77,109,.6);color:#ffb3c1}
.toast-item.ok{border-color:rgba(34,224,138,.6);color:#9df3c8}
.toast-item.gold{border-color:rgba(255,197,61,.6);color:#ffe6a8}

/* ============ PRESENTATION ============ */
#view-present{background:
  radial-gradient(1200px 700px at 50% -15%, rgba(59,107,255,.28), transparent 62%),
  radial-gradient(900px 600px at 100% 110%, rgba(168,85,247,.20), transparent 60%),
  #03050e;min-height:100vh;display:none;flex-direction:column;overflow:hidden}
#view-present.active{display:flex}
.pres-top{display:flex;align-items:center;gap:1rem;padding:.75rem 1.6rem;
  border-bottom:1px solid rgba(90,150,255,.2);background:rgba(4,7,18,.55);flex-wrap:wrap}
.pres-top img{width:60px;height:60px;object-fit:contain;border-radius:50%;
  filter:drop-shadow(0 0 16px rgba(40,224,255,.55))}
.pres-top .t1{font-size:1.45rem;font-weight:900;
  background:linear-gradient(180deg,#fff,#7fd4ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.pres-top .t2{font-size:.74rem;color:#7f95c4;font-weight:700;letter-spacing:1px}
.pres-slogan{font-size:.9rem;font-weight:900;color:#ffdf9a;padding:.4rem 1rem;border-radius:999px;
  border:1px solid rgba(255,197,61,.45);background:rgba(255,197,61,.08);white-space:nowrap}
.pres-main{flex:1;display:flex;flex-direction:column;justify-content:center;align-items:center;
  padding:1.5rem 2rem;gap:1.2rem;position:relative;min-height:0}
.pres-q{font-size:clamp(1.5rem,3.6vw,3.1rem);font-weight:900;text-align:center;line-height:1.5;
  max-width:1500px;text-shadow:0 0 60px rgba(40,224,255,.28);animation:qIn .45s ease-out}
@keyframes qIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
.pres-choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:1rem;

.pres-choice{padding:1rem 1.3rem;border-radius:16px;border:1px solid rgba(90,150,255,.35);

.pres-choice[data-clickable="1"]{cursor:pointer;transition:.15s}
.pres-choice[data-clickable="1"]:hover{transform:translateY(-3px) scale(1.01);

.pres-choice .kk{width:44px;height:44px;flex-shrink:0;border-radius:12px;display:grid;place-items:center;

.pres-choice.correct{border-color:rgba(34,224,138,.85);background:linear-gradient(180deg,rgba(20,80,55,.9),rgba(8,40,26,.95));

.pres-choice.hidden{opacity:.18;filter:blur(1px);pointer-events:none}
.pres-choice.selected{border-color:var(--gold);background:linear-gradient(180deg,rgba(90,70,15,.92),rgba(40,30,5,.96));
  box-shadow:0 0 44px rgba(255,197,61,.5)}
.pres-choice.selected .kk{background:rgba(255,197,61,.35)}
.pres-timer{font-size:clamp(2.6rem,6vw,5rem);font-weight:900;font-variant-numeric:tabular-nums;line-height:1;

.pres-timer.low{color:#ff6b86;text-shadow:0 0 46px rgba(255,77,109,.8);animation:pulseT .8s infinite}
@keyframes pulseT{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.timeup-msg{font-size:clamp(2rem,5vw,3.8rem);font-weight:900;color:#ff6b86;
  text-shadow:0 0 40px rgba(255,77,109,.75);text-align:center;margin:.5rem 0;
  animation:pulseT .85s infinite}
.pres-scorebar{display:flex;gap:.7rem;padding:.8rem 1.2rem;border-top:1px solid rgba(90,150,255,.2);
  background:rgba(4,7,18,.65);overflow-x:auto;justify-content:center;flex-wrap:wrap}
.pscore{display:flex;align-items:center;gap:.55rem;padding:.4rem .95rem .4rem .5rem;border-radius:999px;
  background:rgba(10,17,42,.9);border:1px solid rgba(90,150,255,.25);min-width:0;transition:.3s;flex-shrink:0}
.pscore img{width:40px;height:40px;border-radius:50%;object-fit:cover;border:2px solid var(--tc,#3b6bff)}
.pscore .n{font-size:.9rem;font-weight:800;white-space:nowrap}
.pscore .s{font-size:1.25rem;font-weight:900;color:#ffd977;font-variant-numeric:tabular-nums}
.pscore.lead{border-color:rgba(255,197,61,.8);box-shadow:0 0 26px rgba(255,197,61,.45);
  background:linear-gradient(180deg,rgba(60,45,10,.9),rgba(20,15,4,.95))}
.pscore.answering{border-color:var(--cyan);box-shadow:0 0 26px rgba(40,224,255,.55);
  background:linear-gradient(180deg,rgba(10,50,90,.9),rgba(5,20,40,.95))}
.pres-idle{text-align:center;opacity:.85}
.pres-idle .big{font-size:clamp(1.8rem,4vw,3.4rem);font-weight:900;
  background:linear-gradient(180deg,#fff,#5fa8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.fx{position:fixed;inset:0;display:grid;place-items:center;pointer-events:none;z-index:800}
.fx .bubble{padding:1.6rem 3.4rem;border-radius:24px;font-size:clamp(1.8rem,5vw,3.6rem);font-weight:900;
  animation:fxPop 1.9s ease-out forwards;text-align:center}
.fx.correct .bubble{background:rgba(10,60,40,.93);border:2px solid var(--ok);color:#8dffc6;box-shadow:0 0 90px rgba(34,224,138,.7)}
.fx.wrong .bubble{background:rgba(60,10,20,.93);border:2px solid var(--bad);color:#ffb3c1;box-shadow:0 0 90px rgba(255,77,109,.7)}
.fx.card .bubble{background:rgba(30,15,60,.95);border:2px solid var(--purple);color:#e2c7ff;box-shadow:0 0 90px rgba(168,85,247,.75)}
@keyframes fxPop{0%{opacity:0;transform:scale(.55) rotate(-5deg)}18%{opacity:1;transform:scale(1.08) rotate(0)}
  30%{transform:scale(1)}78%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.14)}}
.countdown-num{font-size:clamp(6rem,22vw,17rem);font-weight:900;line-height:1;
  background:linear-gradient(180deg,#fff,#28e0ff);-webkit-background-clip:text;background-clip:text;color:transparent;
  filter:drop-shadow(0 0 60px rgba(40,224,255,.85));animation:cdPulse 1s ease-out}
@keyframes cdPulse{0%{transform:scale(.4);opacity:0}40%{transform:scale(1.12);opacity:1}100%{transform:scale(1);opacity:.95}}
.results-wrap{padding:2rem;text-align:center;width:100%;max-width:1200px;margin:0 auto;animation:qIn .5s}
.results-title{font-size:clamp(1.8rem,4vw,3.2rem);font-weight:900;margin-bottom:1.6rem;
  background:linear-gradient(180deg,#fff,#ffd977);-webkit-background-clip:text;background-clip:text;color:transparent}
.podium{display:flex;gap:1.2rem;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin-bottom:2rem}
.pod{border-radius:20px;padding:1.2rem;min-width:190px;border:1px solid var(--line2);
  background:linear-gradient(180deg,rgba(20,32,74,.92),rgba(8,14,34,.96));position:relative;overflow:hidden}
.pod img{width:84px;height:84px;border-radius:50%;object-fit:cover;margin:0 auto .7rem;border:3px solid var(--tc,#3b6bff)}
.pod .pn{font-weight:900;font-size:1.1rem}
.pod .ps{font-size:2rem;font-weight:900;color:#ffd977;line-height:1.1}
.pod .pr{font-size:.78rem;color:#9fb4dd;font-weight:800;letter-spacing:1px}
.pod.first{border-color:rgba(255,197,61,.9);box-shadow:0 0 60px rgba(255,197,61,.45);transform:scale(1.07)}
.pod.first::before{content:'🏆';position:absolute;top:6px;left:10px;font-size:1.6rem;animation:floaty 3s infinite}

.hint{background:rgba(40,224,255,.07);border:1px solid rgba(40,224,255,.28);border-radius:12px;
  padding:.7rem .9rem;font-size:.82rem;color:#a9d8ff;line-height:1.7}
.hint.warn{background:rgba(255,159,67,.08);border-color:rgba(255,159,67,.35);color:#ffd0a3}
.hint.bad{background:rgba(255,77,109,.08);border-color:rgba(255,77,109,.35);color:#ffb3c1}
.kbd{display:inline-block;padding:.12rem .45rem;border-radius:6px;background:#131f45;
  border:1px solid var(--line2);font-size:.74rem;font-weight:800;font-family:monospace}
.fs-btn{position:fixed;bottom:1rem;left:1rem;z-index:100;opacity:.35;transition:.2s}
.fs-btn:hover{opacity:1}

.live-state-banner{padding:.65rem .9rem;border-radius:11px;font-weight:800;font-size:.88rem;
  display:flex;align-items:center;gap:.6rem;border:1px solid var(--line);margin-bottom:.8rem;
  background:rgba(10,17,42,.8)}
.live-state-banner.waiting{border-color:rgba(90,150,255,.4);color:#bcd4ff}
.live-state-banner.answering{border-color:rgba(40,224,255,.6);color:#8fd8ff;background:rgba(10,40,70,.6)}
.live-state-banner.locked{border-color:rgba(255,197,61,.6);color:#ffe0a3;background:rgba(50,35,10,.6)}
.live-state-banner.timeup{border-color:rgba(255,77,109,.6);color:#ffb3c1;background:rgba(50,10,20,.6)}
.live-state-banner.scored{border-color:rgba(34,224,138,.6);color:#9df3c8;background:rgba(10,50,30,.6)}

/* ============ TEAM DEVICE ============ */
.team-answer-page{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:1.4rem;text-align:center;gap:1.2rem;max-width:900px;margin:0 auto}
.team-answer-page .tq{font-size:clamp(1.3rem,3vw,2.2rem);font-weight:900;line-height:1.6}
.team-answer-page .tchoices{display:grid;gap:.8rem;width:100%;max-width:680px}
.team-answer-page .tchoice{padding:1rem 1.3rem;border-radius:14px;border:1px solid var(--line2);
  background:rgba(12,20,48,.9);font-size:clamp(1rem,2vw,1.4rem);font-weight:800;cursor:pointer;
  transition:.15s;text-align:right;color:inherit;font-family:inherit}
.team-answer-page .tchoice:hover{transform:translateY(-2px);border-color:var(--cyan);
  box-shadow:0 0 26px rgba(40,224,255,.4)}
.team-answer-page .tchoice.selected{border-color:var(--gold);background:rgba(255,197,61,.16);cursor:not-allowed}
.team-answer-page .tchoice.disabled{opacity:.45;cursor:not-allowed;pointer-events:none}

/* ============ TACTICAL ARENA ============ */
#view-arena{background:
  radial-gradient(ellipse at 50% 0%, #1a1040 0%, #05030d 70%);
  min-height:100vh;display:none;flex-direction:column;overflow:hidden;position:relative}
#view-arena.active{display:flex}
#view-arena::before{content:'';position:absolute;inset:0;pointer-events:none;
  background-image:
    radial-gradient(circle at 20% 30%, rgba(168,85,247,.14), transparent 40%),
    radial-gradient(circle at 80% 70%, rgba(40,224,255,.12), transparent 40%),
    radial-gradient(circle at 50% 50%, rgba(255,197,61,.06), transparent 60%);
  animation:arenaBg 12s ease-in-out infinite alternate}
@keyframes arenaBg{0%{opacity:.7}100%{opacity:1}}
.arena-top{display:flex;align-items:center;gap:1rem;padding:.75rem 1.4rem;
  border-bottom:1px solid rgba(120,190,255,.25);background:rgba(4,7,18,.78);
  backdrop-filter:blur(14px);position:relative;z-index:2;flex-wrap:wrap}
.arena-top img{width:46px;height:46px;border-radius:50%;object-fit:contain;
  background:#0b1330;padding:3px;border:1px solid var(--line2);box-shadow:0 0 18px rgba(40,224,255,.4)}
.arena-top h1{font-size:1.25rem;font-weight:900;
  background:linear-gradient(180deg,#fff,#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-shadow:0 0 30px rgba(168,85,247,.35)}
.arena-top .arena-tabs{display:flex;gap:.35rem;background:rgba(10,17,42,.7);padding:.25rem;border-radius:11px;border:1px solid var(--line)}
.arena-top .arena-tabs button{padding:.45rem .85rem;border-radius:9px;border:none;background:transparent;
  color:#9fb0d6;font-weight:800;font-size:.85rem;cursor:pointer;transition:.15s}
.arena-top .arena-tabs button.on{background:linear-gradient(135deg,#7c3aed,#a855f7);color:#fff;box-shadow:0 0 20px rgba(168,85,247,.45)}

.arena-main{flex:1;display:flex;flex-direction:column;gap:1rem;padding:1.2rem 1.4rem;overflow-y:auto;
  position:relative;z-index:1;min-height:0}
.arena-stage{position:relative;min-height:340px;display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:1.2rem;padding:1rem;
  border-radius:22px;border:1px solid rgba(120,190,255,.22);
  background:radial-gradient(ellipse at 50% 30%, rgba(30,20,70,.85), rgba(5,3,15,.95));
  box-shadow:inset 0 0 80px rgba(168,85,247,.14);overflow:hidden}
.arena-stage::before{content:'';position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(90deg,transparent 0,transparent 60px,
    rgba(120,190,255,.04) 60px, rgba(120,190,255,.04) 61px);opacity:.5}

.arena-teams{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;align-items:center;
  padding:.6rem;max-width:1200px}
.arena-team{width:118px;padding:.85rem .5rem;border-radius:16px;text-align:center;
  background:linear-gradient(180deg,rgba(20,30,70,.92),rgba(8,12,30,.97));
  border:2px solid rgba(90,150,255,.28);transition:.3s;position:relative;opacity:.92}
.arena-team img{width:64px;height:64px;border-radius:50%;object-fit:cover;margin:0 auto .45rem;
  border:3px solid var(--tc,#3b6bff);transition:.3s;background:#08102a}
.arena-team .n{font-weight:900;font-size:.85rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  line-height:1.2}
.arena-team .sc{font-size:.72rem;color:#ffd977;font-weight:800;margin-top:.2rem}
.arena-team.spinning{animation:teamPulse .28s infinite alternate;border-color:var(--cyan);
  box-shadow:0 0 30px rgba(40,224,255,.55)}
.arena-team.winner{border-color:var(--gold);
  background:linear-gradient(180deg,rgba(70,50,10,.95),rgba(30,20,5,.98));
  box-shadow:0 0 60px rgba(255,197,61,.7), inset 0 0 30px rgba(255,197,61,.2);
  transform:scale(1.15);opacity:1}
.arena-team.winner img{animation:winnerPulse .9s ease-out}
.arena-team.dim{opacity:.28;filter:grayscale(.7)}
@keyframes teamPulse{0%{transform:scale(1)}100%{transform:scale(1.06);box-shadow:0 0 44px rgba(40,224,255,.7)}}
@keyframes winnerPulse{0%{transform:scale(1)}40%{transform:scale(1.25);filter:drop-shadow(0 0 30px #ffc53d)}
  100%{transform:scale(1)}}

.arena-cards{display:flex;flex-wrap:wrap;gap:1rem;justify-content:center;padding:.6rem;max-width:1200px}
.arena-card{width:140px;height:200px;border-radius:14px;position:relative;overflow:hidden;
  border:2px solid rgba(255,255,255,.18);transition:.35s;transform-style:preserve-3d;
  display:flex;flex-direction:column;padding:.75rem .7rem;color:#fff;font-weight:900;
  box-shadow:0 8px 24px rgba(0,0,0,.4)}
.arena-card .acn{font-size:.92rem;line-height:1.3;margin-bottom:.35rem;position:relative;z-index:2}
.arena-card .acd{font-size:.68rem;opacity:.95;flex:1;line-height:1.45;position:relative;z-index:2;font-weight:600}
.arena-card .acf{font-size:.65rem;font-weight:800;opacity:.95;position:relative;z-index:2}
.arena-card .emoji{position:absolute;top:6px;left:6px;font-size:1.4rem;opacity:.9;z-index:2}
.arena-card .sheen{position:absolute;inset:0;
  background:linear-gradient(160deg,rgba(255,255,255,.28),transparent 42%);pointer-events:none;z-index:1}
.arena-card.spinning{animation:cardShuffle .32s infinite alternate}
.arena-card.winner{transform:scale(1.18) translateY(-6px);border-color:var(--gold);
  box-shadow:0 0 60px rgba(255,197,61,.85), 0 0 100px rgba(168,85,247,.4);z-index:3;
  animation:winnerCardPop .8s ease-out}
.arena-card.dim{opacity:.32;filter:saturate(.5)}
.arena-card.face-down{background:linear-gradient(135deg,#1e1b4b,#312e81)!important;
  border-color:rgba(168,85,247,.6)!important}
.arena-card.face-down .acn,.arena-card.face-down .acd,.arena-card.face-down .acf,.arena-card.face-down .emoji{opacity:0}
.arena-card.face-down::after{content:'🃏';position:absolute;inset:0;display:grid;place-items:center;
  font-size:3rem;opacity:.85;z-index:2}
@keyframes cardShuffle{0%{transform:rotate(-5deg) translate(-6px,-4px)}
  100%{transform:rotate(5deg) translate(6px,6px)}}
@keyframes winnerCardPop{0%{transform:scale(.6) rotate(-10deg)}
  50%{transform:scale(1.28) rotate(4deg)}100%{transform:scale(1.18) translateY(-6px) rotate(0)}}

.arena-result{text-align:center;padding:1.5rem;animation:resultIn .55s ease-out;position:relative;z-index:2}
@keyframes resultIn{from{opacity:0;transform:scale(.85)}to{opacity:1;transform:scale(1)}}
.arena-result .msg{font-size:clamp(1.4rem,3.2vw,2.6rem);font-weight:900;color:#ffe9a8;
  text-shadow:0 0 40px rgba(255,197,61,.6);line-height:1.5;
  background:linear-gradient(180deg,#fff,#ffd977);-webkit-background-clip:text;background-clip:text;color:transparent}
.arena-result .sub{font-size:1.1rem;color:#c8b6ff;margin-top:.75rem;font-weight:700;text-shadow:0 0 20px rgba(168,85,247,.5)}
.arena-result .card-preview{display:inline-block;margin-top:1rem;padding:1rem 1.6rem;border-radius:16px;
  font-size:1.3rem;font-weight:900;border:2px solid rgba(255,255,255,.3);
  animation:cardPreviewIn .7s ease-out .15s backwards}
@keyframes cardPreviewIn{from{opacity:0;transform:translateY(20px) scale(.85)}to{opacity:1;transform:none}}

.arena-controls{padding:1rem 1.4rem;border-top:1px solid rgba(120,190,255,.25);
  background:rgba(4,7,18,.78);backdrop-filter:blur(14px);position:relative;z-index:2;
  display:flex;gap:.6rem;flex-wrap:wrap;align-items:center}
.arena-controls .btn{padding:.6rem 1.1rem;font-size:.88rem}

.arena-inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:.9rem;padding:.5rem 0}
.arena-inv-card{padding:.85rem 1rem;border-radius:14px;
  background:linear-gradient(180deg,rgba(20,30,70,.85),rgba(8,12,30,.95));
  border:1px solid var(--line);transition:.18s}
.arena-inv-card:hover{border-color:var(--line2)}
.arena-inv-card .head{display:flex;align-items:center;gap:.6rem;margin-bottom:.65rem}
.arena-inv-card .head img{width:42px;height:42px;border-radius:50%;object-fit:cover;
  border:2px solid var(--tc,#3b6bff);flex-shrink:0}
.arena-inv-card .head .nm{flex:1;font-weight:900;font-size:.92rem;line-height:1.2}
.arena-inv-card .head .cnt{font-size:1.05rem;font-weight:900;color:var(--gold);background:rgba(255,197,61,.12);
  padding:.15rem .55rem;border-radius:999px;border:1px solid rgba(255,197,61,.4)}
.arena-inv-card .mini-cards{display:flex;flex-wrap:wrap;gap:.35rem}
.mini-card{padding:.35rem .65rem;border-radius:9px;font-size:.74rem;font-weight:800;cursor:pointer;
  border:1px solid rgba(255,255,255,.2);transition:.15s;position:relative}
.mini-card:hover{transform:translateY(-2px);box-shadow:0 0 16px rgba(255,255,255,.2)}
.mini-card.used{opacity:.4;text-decoration:line-through;cursor:default}
.mini-card .num{display:inline-block;margin-right:.3rem;background:rgba(0,0,0,.35);
  padding:0 .4rem;border-radius:6px;font-size:.68rem}

.arena-history{padding:.5rem 0;max-height:280px;overflow-y:auto}
.arena-history .hrow{display:flex;gap:.6rem;align-items:center;padding:.45rem .7rem;
  border-radius:9px;font-size:.82rem;border-bottom:1px solid rgba(120,190,255,.1)}
.arena-history .hrow .t{color:var(--muted);font-size:.72rem;min-width:65px}
.arena-history .hrow .ic{font-size:1rem;width:24px;text-align:center}
.arena-history .hrow .txt{flex:1}

.arena-mode-public .arena-main{padding:1.5rem 2rem}
.arena-mode-public .arena-stage{min-height:60vh;border-color:rgba(168,85,247,.5);
  box-shadow:inset 0 0 120px rgba(168,85,247,.25), 0 0 60px rgba(168,85,247,.2)}
.arena-mode-public .arena-team{width:140px;padding:1rem .6rem}
.arena-mode-public .arena-team img{width:80px;height:80px}
.arena-mode-public .arena-team .n{font-size:1rem}
.arena-mode-public .arena-card{width:170px;height:240px}
.arena-mode-public .arena-card .acn{font-size:1.05rem}
.arena-mode-public .arena-card .acd{font-size:.78rem}
.arena-mode-public .arena-result .msg{font-size:clamp(2rem,4.5vw,3.6rem)}
.arena-mode-public .arena-controls{display:none}

.arena-top-btn{padding:.55rem 1rem;border-radius:11px;border:1px solid var(--line2);
  background:rgba(10,17,42,.8);color:#dbe7ff;font-weight:800;font-size:.85rem;cursor:pointer;transition:.15s;
  display:inline-flex;align-items:center;gap:.4rem}
.arena-top-btn:hover{border-color:var(--cyan);box-shadow:var(--glow)}

@media(max-width:900px){
  .dash{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;overflow-x:auto;border-left:none;border-bottom:1px solid var(--line)}
  .side a{white-space:nowrap}
  .side .ico{display:none}
  .arena-team{width:96px}
  .arena-card{width:118px;height:170px}
}
@media print{
  body{background:#fff;color:#000}
  .btn,.side,.topbar{display:none!important}
}
</style>

<script>
'use strict';

/* =====================================================================
   HELPERS
   ===================================================================== */
const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const SALT = 'brainclash::v1::';
const LS_KEY = 'brainclash_state_v1';
const SESSION_KEY = 'brainclash_session';

async function sha256(str) {
  if (!window.crypto || !crypto.subtle) {
    let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) | 0;
    return 'fb' + (h >>> 0).toString(16);
  }
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}

function makeLogo(emoji, color) {
  const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120">
    <defs><radialGradient id="g" cx="50%" cy="32%">
      <stop offset="0" stop-color="${color}" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#05060f"/></radialGradient></defs>
    <circle cx="60" cy="60" r="56" fill="url(#g)" stroke="${color}" stroke-width="4"/>
    <circle cx="60" cy="60" r="47" fill="none" stroke="${color}" stroke-opacity="0.35" stroke-width="1.5"/>
    <text x="60" y="79" font-size="52" text-anchor="middle">${emoji}</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

let _actx = null;
function ac() {
  if (!_actx) { const C = window.AudioContext || window.webkitAudioContext; if (C) _actx = new C(); }
  return _actx;
}
function beep(freq, dur = .14, type = 'sine', vol = .13) {
  if (!state || !state.settings.sound) return;
  try {
    const c = ac(); if (!c) return;
    if (c.state === 'suspended') c.resume();
    const o = c.createOscillator(), g = c.createGain();
    o.type = type; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, c.currentTime);
    g.gain.exponentialRampToValueAtTime(.0008, c.currentTime + dur);
    o.connect(g); g.connect(c.destination);
    o.start(); o.stop(c.currentTime + dur + .02);
  } catch (e) {}
}
const SND = {
  tick()   { beep(880, .045, 'square', .05); },
  start()  { beep(520, .09); setTimeout(() => beep(780, .13), 95); },
  correct(){ beep(660, .1); setTimeout(() => beep(880, .12), 100); setTimeout(() => beep(1180, .22), 210); },
  wrong()  { beep(190, .22, 'sawtooth', .11); setTimeout(() => beep(130, .34, 'sawtooth', .11), 170); },
  card()   { beep(1150, .07, 'triangle', .1); setTimeout(() => beep(1550, .12, 'triangle', .09), 80); },
  spin()   { beep(400, .05, 'square', .04); },
  win()    { [523, 659, 784, 1046, 1318].forEach((f, i) => setTimeout(() => beep(f, .3, 'triangle', .13), i * 145)); },
  timeout(){ beep(300, .3, 'sawtooth', .12); setTimeout(() => beep(200, .45, 'sawtooth', .12), 260); }
};
function playSound(name) { try { SND[name] && SND[name](); } catch (e) {} }

let storageOK = true;
function readRaw() { try { return localStorage.getItem(LS_KEY); } catch (e) { storageOK = false; return null; } }
function writeRaw(v) { try { localStorage.setItem(LS_KEY, v); return true; } catch (e) { storageOK = false; return false; } }

/* =====================================================================
   DEFAULTS
   ===================================================================== */

    c('وقت إضافي', 'يمنح الفريق 15 ثانية إضافية على المؤقت.', '#28e0ff', 'extraTime', 15, 2, '⏱️'),
    c('خمسون بالمئة', 'يحذف إجابتين خاطئتين من سؤال الاختيار المتعدد.', '#a855f7', 'fiftyFifty', 2, 1, '➗'),
    c('سرقة الدور', 'يسرق الفريق السؤال الحالي (تُطبَّق يدوياً).', '#ff4d6d', 'steal', 0, 1, '🎯'),
    c('سؤال إضافي', 'يمنح الفريق 10 نقاط إضافية فورية.', '#ffc53d', 'bonus', 10, 1, '🎁'),
    c('درع الحماية', 'يحمي الفريق من خصم نقاط واحد.', '#22e08a', 'shield', 0, 1, '🛡️'),

    c('بطاقة الغموض', 'تأثير عشوائي يحدده النظام.', '#7c3aed', 'mystery', 0, 1, '❓'),
    c('السؤال الذهبي', 'سؤال خاص عالي القيمة (يدوياً).', '#ffd977', 'golden', 20, 1, '🥇'),
    c('بطاقة الإنقاذ', 'محاولة ثانية للسؤال (يدوياً).', '#22e08a', 'rescue', 0, 1, '🆘')

function defaultQuestions() {

        format: 'open', correctText: 'طوكيو', timeLimit: 20 }),

        choices: ['4', '5', '6', '8'], correctIndex: 2 }),
    q({ text: 'ما ناتج 12 × 12 ؟', category: 'رياضيات', difficulty: 'medium', points: 15,
        format: 'quick', correctText: '144', timeLimit: 10 }),
    q({ text: 'من مؤلف كتاب «المقدمة»؟', category: 'ثقافة', difficulty: 'medium', points: 15,
        choices: ['ابن خلدون', 'ابن سينا', 'ابن رشد', 'الجاحظ'], correctIndex: 0 })

}

function defaultState() {
  return {
    version: 3,
    school: { name: 'ثانوية الشيخ عبدالعزيز بن باز', logo: '' },
    event: {
      title: 'صراع الأدمغة',
      slogan: 'المسألة مو بس مذاكرة.. المسألة سرعة وتكتيك!',
      audience: 'طلاب الصف الثاني الثانوي',
      supervisor: 'أ. محمد السبر',
      date: ''
    },
    auth: { username: 'admin', passHash: '' },
    settings: {
      sound: true, volume: .6,
      modes: { turn: true, speed: true, mcq: true, sudden: true, custom: true },
      timerDefault: 30, penaltyDefault: 0, bonusDefault: 0, tieBreak: true,
      pointsByDifficulty: { easy: 10, medium: 15, hard: 25 },
      autoScore: false,
      allowLateAnswer: false,
      answerMode: 'organizer',
      allowPresenterClick: true,
      timerPresets: [10, 15, 20, 30, 60],
      /* ---- arena / card rules (Phase 3) ---- */
      cardRules: {
        method: 'random-team-random-card',   // 'random-team-random-card' | 'specific-team-random-card' | 'random-card-random-team'
        allowOtherTeamTurn: false,
        allowStacking: false,
        carryOverRounds: true,
        expireAtEnd: false,
        maxHold: 99,
        confirmDraw: true,
        animateDuration: 3200                  // ms
      }
    },
    teams: defaultTeams(),
    questions: defaultQuestions(),
    cards: defaultCards(),
    cardSupply: {},     // {cardId: remainingCopies} — lazy init
    cardHistory: [],    // [{id,ts,type,teamId,cardId,note}]
    live: {
      status: 'idle',
      mode: 'turn',
      questionId: null,
      teamId: null,
      revealed: false,
      hiddenChoices: [],
      doubleTeam: null,
      shieldTeams: [],
      timer: { running: false, endAt: 0, remaining: 0, total: 0 },
      fx: null,
      round: 1,
      countdown: 0,
      cardFx: null,
      selectedChoice: null,
      selectedTeamId: null,
      answerLocked: false,
      answerTs: null,
      timeUp: false,
      scored: false,
      firstResponder: null
    },
    arena: {
      mode: 'organizer',          // organizer | public
      stage: 'idle',              // idle | spinning-team | team-result | spinning-card | card-result | announcement
      selectedTeamId: null,
      selectedCardId: null,

      spinDuration: 3200,
      message: '',
      subMessage: '',
      hideCardDuringSpin: true
    },

    history: []
  };
}

/* =====================================================================
   LOAD / SAVE / SYNC
   ===================================================================== */
let state = defaultState();

function ensureCardSupply() {
  if (!state.cardSupply || typeof state.cardSupply !== 'object') state.cardSupply = {};
  const n = Math.max(1, activeTeams().length);
  state.cards.forEach(c => {
    if (typeof state.cardSupply[c.id] !== 'number') {
      state.cardSupply[c.id] = Math.max(0, (c.uses || 1) * n);
    }
  });
}
function ensureCardMaps() {
  state.teams.forEach(t => {
    if (!t.cards || typeof t.cards !== 'object') t.cards = {};
    if (!t.cardsUsed || typeof t.cardsUsed !== 'object') t.cardsUsed = {};
  });
}
function ensureCardRules() {
  const d = defaultState().settings.cardRules;
  state.settings.cardRules = Object.assign({}, d, state.settings.cardRules || {});
}

function loadState() {
  const raw = readRaw();
  if (!raw) return null;
  try {
    const parsed = JSON.parse(raw);
    const base = defaultState();
    const merged = Object.assign(base, parsed);
    merged.school = Object.assign(base.school, parsed.school || {});
    merged.event = Object.assign(base.event, parsed.event || {});
    merged.settings = Object.assign(base.settings, parsed.settings || {});
    merged.settings.modes = Object.assign(base.settings.modes, (parsed.settings || {}).modes || {});
    merged.live = Object.assign(base.live, parsed.live || {});
    merged.live.timer = Object.assign(base.live.timer, (parsed.live || {}).timer || {});
    merged.arena = Object.assign(base.arena, parsed.arena || {});
    if (merged.arena.stage === 'spinning-team' || merged.arena.stage === 'spinning-card') {
      // stale animation from a previous session — reset
      merged.arena.stage = 'idle';
    }
    if (!Array.isArray(merged.teams) || !merged.teams.length) merged.teams = defaultTeams();
    if (!Array.isArray(merged.questions)) merged.questions = [];
    if (!Array.isArray(merged.cards)) merged.cards = [];
    if (!Array.isArray(merged.scoreLog)) merged.scoreLog = [];
    if (!Array.isArray(merged.history)) merged.history = [];
    if (!Array.isArray(merged.cardHistory)) merged.cardHistory = [];
    if (!merged.cardSupply || typeof merged.cardSupply !== 'object') merged.cardSupply = {};
    state = merged;
    ensureCardMaps();
    ensureCardRules();
    ensureCardSupply();
    return merged;
  } catch (e) { console.error('state parse error', e); return null; }
}

let _bc = null;
try { if ('BroadcastChannel' in window) _bc = new BroadcastChannel('brainclash'); } catch (e) {}

function save(broadcast = true) {
  const ok = writeRaw(JSON.stringify(state));
  if (!ok) toast('تعذّر الحفظ في المتصفح — تحقق من إعدادات التخزين', 'bad');
  if (broadcast && _bc) { try { _bc.postMessage({ type: 'state', t: Date.now() }); } catch (e) {} }
}
if (_bc) {
  _bc.onmessage = (e) => {
    if (e.data && e.data.type === 'state') {
      const s = loadState();
      if (s) { safeRender(); }
    }
  };
}
window.addEventListener('storage', (e) => {
  if (e.key === LS_KEY) { const s = loadState(); if (s) safeRender(); }
});

/* =====================================================================
   UI PRIMITIVES
   ===================================================================== */
let toastTimer = null;
function toast(msg, kind = '') {
  const wrap = $('#toast');
  wrap.innerHTML = `<div class="toast-item ${kind}">${esc(msg)}</div>`;
  wrap.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => wrap.classList.remove('show'), 2600);
}
let modalOnClose = null;
function openModal(title, bodyHTML, footerHTML, opts = {}) {
  const box = $('#modal-box');
  box.innerHTML = `
    <div class="mh"><h3>${esc(title)}</h3>
      <button class="btn icon ghost" onclick="App.closeModal()">✕</button></div>
    <div class="mb">${bodyHTML}</div>
    ${footerHTML ? `<div class="mf">${footerHTML}</div>` : ''}`;
  if (opts.width) box.style.maxWidth = opts.width; else box.style.maxWidth = '';
  $('#modal-root').classList.add('on');
  modalOnClose = opts.onClose || null;
  if (opts.focus) setTimeout(() => { const f = $('#' + opts.focus); if (f) f.focus(); }, 60);
}
function closeModal() {
  $('#modal-root').classList.remove('on');
  if (modalOnClose) { const f = modalOnClose; modalOnClose = null; f(); }
}
function confirmDialog(title, text, onYes, yesLabel = 'تأكيد', danger = true) {
  openModal(title, `<p style="line-height:1.9">${text}</p>`,
    `<button class="btn ${danger ? 'bad' : 'primary'}" id="cf-yes">${esc(yesLabel)}</button>
     <button class="btn ghost" onclick="App.closeModal()">إلغاء</button>`);
  $('#cf-yes').onclick = () => { closeModal(); onYes(); };
}

/* =====================================================================
   ACCESSORS
   ===================================================================== */
const getTeam = id => state.teams.find(t => t.id === id);
const getQuestion = id => state.questions.find(q => q.id === id);
const getCard = id => state.cards.find(c => c.id === id);
const activeTeams = () => state.teams.filter(t => t.active);
const sortedTeams = () => activeTeams().slice().sort((a, b) => b.score - a.score);
const currentQuestion = () => getQuestion(state.live.questionId);
function cardUsesLeft(team, cardId) { return (team.cards && team.cards[cardId]) || 0; }
function cardUsesUsed(team, cardId) { return (team.cardsUsed && team.cardsUsed[cardId]) || 0; }

function isLogged() {
  try { return sessionStorage.getItem(SESSION_KEY) === 'ok'; } catch (e) { return false; }
}
function setLogged(v) {
  try { v ? sessionStorage.setItem(SESSION_KEY, 'ok') : sessionStorage.removeItem(SESSION_KEY); } catch (e) {}
}

/* =====================================================================
   SCORING
   ===================================================================== */
function applyScore(teamId, delta, reason, extra = {}) {
  const t = getTeam(teamId);
  if (!t) return;
  t.score += delta;
  if (extra.correct) t.correct += 1;
  if (extra.wrong) t.wrong += 1;
  state.scoreLog.push({
    id: uid(), ts: Date.now(), teamId, delta,
    reason: reason || '', correct: extra.correct ? 1 : 0, wrong: extra.wrong ? 1 : 0
  });
  if (state.scoreLog.length > 500) state.scoreLog.splice(0, state.scoreLog.length - 500);
}
function undoScore() {
  if (!state.scoreLog.length) { toast('لا يوجد إجراء للتراجع عنه', 'bad'); return; }
  const last = state.scoreLog.pop();
  const t = getTeam(last.teamId);
  if (t) { t.score -= last.delta; t.correct -= last.correct; t.wrong -= last.wrong; }
  state.live.fx = { id: uid(), type: 'card', text: '↩️ تم التراجع عن آخر إجراء' };
  save(); safeRender();
  toast('تم التراجع عن: ' + (last.reason || 'إجراء'), 'ok');
}

/* =====================================================================
   TIMER
   ===================================================================== */
function timerRemaining() {
  const t = state.live.timer;
  if (t.running) return Math.max(0, (t.endAt - Date.now()) / 1000);
  return Math.max(0, t.remaining);
}
function startTimer(seconds) {
  const t = state.live.timer;
  let rem = timerRemaining();
  if (typeof seconds === 'number') rem = seconds;
  if (rem <= 0) rem = t.total || state.settings.timerDefault;
  t.total = t.total || rem;
  t.remaining = rem;
  t.endAt = Date.now() + rem * 1000;
  t.running = true;
  playSound('start');
}
function pauseTimer() {
  const t = state.live.timer;
  t.remaining = timerRemaining();
  t.running = false;
}
function resetTimer(seconds) {
  const t = state.live.timer;
  t.running = false;
  t.remaining = seconds != null ? seconds : (t.total || state.settings.timerDefault);
  t.total = t.remaining;
  t.endAt = 0;
}
function addTime(sec) {
  const t = state.live.timer;
  if (t.running) t.endAt += sec * 1000;
  else t.remaining = Math.max(0, t.remaining + sec);
  t.total = Math.max(t.total, timerRemaining());
}
function fmtTime(sec) {
  sec = Math.max(0, Math.ceil(sec));
  const m = Math.floor(sec / 60), s = sec % 60;
  return m > 0 ? `${m}:${String(s).padStart(2, '0')}` : String(s);
}

let _lastTickSec = -1;
let _organizerTab = false;
function isOrganizerTab() { return _organizerTab; }

setInterval(() => {
  const t = state.live.timer;
  const rem = timerRemaining();
  const sec = Math.ceil(rem);

  if (t.running && rem <= 0) {
    t.running = false; t.remaining = 0;
    const L = state.live;
    if (L.status === 'question' && !L.answerLocked && !L.timeUp) {
      L.timeUp = true;
      L.fx = { id: 'timeup-' + (L.questionId || '') + '-' + (t.endAt || 0),
               type: 'wrong', text: '⏰ انتهى الوقت!' };
      save();
      if (isOrganizerTab()) playSound('timeout');
    }
  }
  if (t.running && isOrganizerTab() && sec <= 5 && sec > 0 && sec !== _lastTickSec) playSound('tick');
  _lastTickSec = sec;

  $$('[data-timer-num]').forEach(el => {
    el.textContent = fmtTime(rem);
    el.classList.toggle('low', rem <= 10 && rem > 0);
    el.classList.toggle('warn', rem <= 10 && rem > 0);
  });
  $$('[data-timer-bar]').forEach(el => {
    const total = t.total || 1;
    el.style.width = clamp((rem / total) * 100, 0, 100) + '%';
  });

  /* arena spin watchdog */
  if (state.arena && (state.arena.stage === 'spinning-team' || state.arena.stage === 'spinning-card')) {
    const elapsed = Date.now() - state.arena.spinStart;
    if (elapsed > state.arena.spinDuration + 800) {
      // safety: if org tab failed, transition to result
      state.arena.stage = state.arena.stage === 'spinning-team' ? 'team-result' : 'card-result';
      save();
      safeRender();
    }
  }
}, 200);

/* =====================================================================
   CARD EFFECT ENGINE (shared by live + arena)
   ===================================================================== */
function applyCardEffect(team, card) {
  if (!team || !card) return { ok: false, msg: 'بيانات ناقصة', manual: false };
  const L = state.live;
  let msg = '';
  let manual = false;
  switch (card.effect) {
    case 'double':
      L.doubleTeam = team.id; msg = 'نقاط مضاعفة للسؤال القادم'; break;
    case 'extraTime':
      addTime(card.value || 15); msg = `+${card.value || 15} ثانية`; break;
    case 'fiftyFifty': {
      const q = currentQuestion();
      if (q && q.choices && q.choices.length > 2) {
        const wrongs = q.choices.map((_, i) => i).filter(i => i !== q.correctIndex);
        wrongs.sort(() => Math.random() - .5);
        L.hiddenChoices = wrongs.slice(0, 2);
        msg = 'حُذفت إجابتان خاطئتان';
      } else msg = 'لا يوجد سؤال اختيار متعدد مناسب حالياً';
      break;
    }
    case 'bonus':
      applyScore(team.id, card.value || 10, 'بطاقة: ' + card.name);
      msg = `+${card.value || 10} نقطة`; break;
    case 'shield':
      L.shieldTeams.push(team.id); msg = 'محمي من خصم واحد'; break;
    case 'mystery': {
      const outs = [
        { txt: '+10 نقاط', fn: () => applyScore(team.id, 10, 'بطاقة الغموض') },
        { txt: '-5 نقاط', fn: () => applyScore(team.id, -5, 'بطاقة الغموض') },
        { txt: '+15 ثانية', fn: () => addTime(15) },
        { txt: 'لا شيء!', fn: () => {} }
      ];
      const o = outs[Math.floor(Math.random() * outs.length)];
      o.fn(); msg = o.txt; break;
    }
    default:
      msg = 'تُطبَّق يدوياً بواسطة المنظّم';
      manual = true;
  }
  return { ok: true, msg, manual };
}

/* Checks rules before activation. Returns {ok, reason} */
function canActivateCard(team, card) {
  if (!team || !card) return { ok: false, reason: 'بيانات ناقصة' };
  if (cardUsesLeft(team, card.id) <= 0) return { ok: false, reason: 'لا توجد نسخ متاحة لهذا الفريق' };
  const L = state.live;
  const rules = state.settings.cardRules;
  const turnTeam = L.teamId;
  if (!rules.allowOtherTeamTurn && turnTeam && turnTeam !== team.id && L.status === 'question') {
    return { ok: false, reason: 'البطاقات مسموحة فقط في دور الفريق نفسه' };
  }
  if (card.requireQuestion !== false && !currentQuestion() && ['fiftyFifty','extraTime','double'].includes(card.effect)) {
    return { ok: false, reason: 'يلزم وجود سؤال نشط لهذا التأثير' };
  }
  return { ok: true };
}

  } else if (hash.startsWith('#/arena')) {

    _organizerTab = false;

async function doLogin() {
  const u = $('#lg-user').value.trim();

/* =====================================================================
   TAB: LIVE
   ===================================================================== */
function tabLive() {
  const L = state.live;
  const q = currentQuestion();
  const teams = activeTeams();
  const rem = timerRemaining();
  const selTeam = getTeam(L.teamId);
  const answerTeam = getTeam(L.selectedTeamId || L.teamId);
  const isOpen = q && (q.format === 'open' || q.format === 'quick');
  const isChoice = q && !isOpen;
  const clickable = !L.answerLocked && !L.scored && L.teamId;
  const isTimeUp = L.timeUp || (!L.timer.running && rem <= 0 && L.status === 'question' && !L.answerLocked);

  const banner = !q ? `<div class="live-state-banner waiting">💡 اختر سؤالاً للبدء</div>`
    : L.scored ? `<div class="live-state-banner scored">✅ تم احتساب السؤال</div>`
    : L.answerLocked ? `<div class="live-state-banner locked">🔒 تم تسجيل إجابة ${esc((answerTeam||{}).name||'')}</div>`
    : isTimeUp ? `<div class="live-state-banner timeup">⏰ انتهى الوقت — يمكنك التقييم اليدوي</div>`
    : !L.teamId ? `<div class="live-state-banner waiting">👥 اختر الفريق المجيب</div>`
    : `<div class="live-state-banner answering">🎯 ${esc(selTeam ? selTeam.name : '')} يجيب الآن</div>`;

  return `
  <div class="panel-title"><h2>🎮 التحكم المباشر</h2><div class="spacer"></div>
    <span class="badge ${L.status === 'question' ? 'ok' : ''}">${L.status === 'question' ? 'سؤال نشط' : 'متوقفة'}</span>
    <button class="btn sm purple" onclick="App.go('#/arena')">🃏 الساحة</button>
    <button class="btn sm ghost" onclick="App.openPresent()">🖥️ العرض</button>
  </div>

  <div class="live-grid">
    <div>
      <div class="card pad" style="margin-bottom:1rem">
        <div class="row" style="margin-bottom:.8rem">
          <button class="btn primary sm" onclick="App.live.startQuestion()">▶️ ابدأ السؤال</button>
          <button class="btn sm ghost" onclick="App.live.prev()">◀ السابق</button>
          <button class="btn sm ghost" onclick="App.live.next()">التالي ▶</button>
          <button class="btn sm purple" onclick="App.live.random()">🎲 عشوائي</button>
        </div>
        ${banner}
        <div class="qbox">
          ${q ? `
            <div class="row tiny" style="margin-bottom:.6rem">
              <span class="badge">${esc(FORMAT_LABEL[q.format])}</span>
              <span class="badge gold">${q.points} نقطة</span>
              <span class="badge purple">${esc(q.category)}</span>
            </div>
            <div class="qtext">${esc(q.text)}</div>
            ${q.image ? `<img src="${esc(q.image)}" style="max-height:170px;border-radius:12px;margin-top:.8rem">` : ''}
            ${isChoice ? `<div class="choices">
              ${(q.choices || []).map((ch, i) => {
                const isCorrect = i === q.correctIndex;
                const showCorrect = L.revealed && isCorrect;
                const hidden = L.hiddenChoices.includes(i);
                const selected = L.selectedChoice === i && L.answerLocked;
                const cls = [showCorrect ? 'correct' : '', hidden ? 'hidden' : '', selected ? 'selected' : ''].filter(Boolean).join(' ');
                return `<div class="choice ${cls}" onclick="App.live.organizerSelect(${i})">
                  <span class="k">${'أبجدهو'[i] || i + 1}</span><span>${esc(ch)}</span>
                  ${showCorrect ? '<span style="margin-right:auto">✅</span>' : ''}
                  ${selected ? '<span style="margin-right:auto">🎯</span>' : ''}
                </div>`;
              }).join('')}
            </div>` : ''}
            ${isOpen ? `<div class="hint" style="margin-top:.8rem">الإجابة: <b style="color:#9df3c8">${esc(q.correctText || '—')}</b></div>` : ''}
          ` : `<div style="text-align:center;padding:1.5rem" class="muted">اختر سؤالاً للبدء.</div>`}
        </div>
        <div class="row" style="margin-top:.9rem">
          <button class="btn ${L.revealed ? 'gold' : 'primary'} sm" onclick="App.live.reveal()">
            ${L.revealed ? '🙈 إخفاء' : '👁 كشف'}</button>
          <button class="btn ghost sm" onclick="App.live.skip()">⏭ تخطي</button>
          <button class="btn ghost sm" onclick="App.live.clearSelection()">↺ مسح الإجابة</button>
        </div>
      </div>

      <div class="card pad">
        <h3 style="margin-bottom:.8rem">💯 تسجيل النقاط</h3>
        <div class="team-chips">
          ${teams.map(t => `<div class="tchip ${L.teamId === t.id ? 'on' : ''}" onclick="App.live.pickTeam('${t.id}')">
            <img src="${esc(t.logo)}"><span>${esc(t.name)}</span></div>`).join('')}
        </div>
        <div class="row" style="margin-top:.9rem">
          <button class="btn ok" onclick="App.live.correct()" ${L.scored ? 'disabled' : ''}>✅ إجابة صحيحة</button>
          <button class="btn bad" onclick="App.live.wrong()" ${L.scored ? 'disabled' : ''}>❌ إجابة خاطئة</button>
          <button class="btn ghost" onclick="App.live.undo()">↩️ تراجع</button>
        </div>
      </div>
    </div>

    <div>
      <div class="card pad" style="margin-bottom:1rem;text-align:center">
        <div class="timer-big ${rem <= 10 && rem > 0 ? 'warn' : ''}" data-timer-num>${fmtTime(rem)}</div>
        <div class="bar"><i data-timer-bar style="width:${clamp(rem / (state.live.timer.total || 1) * 100, 0, 100)}%"></i></div>
        <div class="row" style="margin-top:.9rem;justify-content:center">
          <button class="btn primary sm" onclick="App.live.toggleTimer()">
            ${state.live.timer.running ? '⏸ إيقاف' : '▶️ تشغيل'}</button>
          <button class="btn ghost sm" onclick="App.live.resetTimer()">🔄 تصفير</button>
          <button class="btn ghost sm" onclick="App.live.addTime(15)">+15ث</button>
        </div>
      </div>

      <div class="card pad" style="margin-bottom:1rem">
        <h3 style="margin-bottom:.7rem">🎬 التحكم</h3>
        <div class="grid" style="gap:.55rem">
          <button class="btn ghost block sm" onclick="App.live.countdown()">⏳ عدّ تنازلي</button>
          <button class="btn ghost block sm" onclick="App.live.nextRound()">🔄 جولة جديدة</button>
          <button class="btn gold block sm" onclick="App.live.finish()">🏁 إنهاء المسابقة</button>
          <button class="btn bad block sm" onclick="App.resetScores()">♻️ تصفير النقاط</button>
        </div>
      </div>
    </div>
  </div>`;
}

/* =====================================================================
   TEAM DEVICE
   ===================================================================== */
function renderTeamPage(teamId) {
  const t = getTeam(teamId);
  const L = state.live;
  const q = currentQuestion();
  const el = $('#team-page');
  if (!t) { el.innerHTML = `<div class="hint bad">فريق غير موجود</div>`; return; }
  if (!q || L.status !== 'question') {
    el.innerHTML = `
      <img src="${esc(t.logo)}" style="width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid ${esc(t.color)}">
      <h2 style="font-weight:900">${esc(t.name)}</h2>
      <div class="hint" style="max-width:500px">بانتظار بدء السؤال.</div>`;
    return;
  }
  const isOpen = q.format === 'open' || q.format === 'quick';
  if (isOpen) {
    el.innerHTML = `
      <img src="${esc(t.logo)}" style="width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid ${esc(t.color)}">
      <h2>${esc(t.name)}</h2>
      <div class="hint" style="max-width:500px">سؤال مفتوح — أجب شفهياً.</div>`;
    return;
  }
  const canSubmit = L.teamId === teamId && !L.answerLocked && !L.timeUp && L.timer.running && timerRemaining() > 0;
  const chosen = L.selectedChoice;
  const isChosen = L.answerLocked && L.selectedTeamId === teamId;
  el.innerHTML = `
    <img src="${esc(t.logo)}" style="width:90px;height:90px;border-radius:50%;object-fit:cover;border:3px solid ${esc(t.color)}">
    <h2 style="font-weight:900">${esc(t.name)}</h2>
    <div class="tiny muted">${L.teamId === teamId ? 'الدور لهذا الفريق' : 'ليس دور هذا الفريق'}</div>
    <div class="timer-big" data-timer-num style="font-size:3rem">${fmtTime(timerRemaining())}</div>
    <div class="tq">${esc(q.text)}</div>
    <div class="tchoices">
      ${(q.choices || []).map((c, i) => {
        const sel = isChosen && chosen === i;
        return `<button class="tchoice ${sel ? 'selected' : ''} ${!canSubmit ? 'disabled' : ''}"
                  ${canSubmit ? `onclick="App.teamSelect('${teamId}',${i})"` : 'disabled'}>
          <b>${'أبجدهو'[i] || i + 1}.</b> ${esc(c)} ${sel ? ' ✓' : ''}</button>`;
      }).join('')}
    </div>`;
}

/* =====================================================================
   PRESENTATION
   ===================================================================== */
let _lastFxId = null;
let _lastCountdown = -1;

function renderPresent() {
  const el = $('#view-present');
  const L = state.live;
  const q = currentQuestion();
  const teams = sortedTeams();
  const rem = timerRemaining();
  const lead = teams[0];
  const answerTeam = getTeam(L.selectedTeamId || L.teamId);

  let fxHTML = '';
  if (L.fx && L.fx.id !== _lastFxId) {
    _lastFxId = L.fx.id;
    fxHTML = `<div class="fx ${esc(L.fx.type)}"><div class="bubble">${esc(L.fx.text)}</div></div>`;
    if (L.fx.type === 'correct') playSound('correct');
    else if (L.fx.type === 'wrong') playSound('wrong');
    else if (L.fx.type === 'card') playSound('card');
  }

  const top = `
  <div class="pres-top">
    <img src="${esc(schoolLogo())}" alt="">
    <div><div class="t1">${esc(state.event.title)}</div>
      <div class="t2">${esc(state.school.name)}</div></div>
    <div class="spacer"></div>
    <div class="pres-slogan">${esc(state.event.slogan)}</div>
    <div class="spacer"></div>
    <div style="text-align:center"><div class="t2">الجولة</div>
      <div style="font-size:1.4rem;font-weight:900;color:#ffd977">${L.round}</div></div>
  </div>`;

  let main = '';
  if (L.status === 'finished') main = renderResultsHTML();
  else if (L.countdown > 0) {
    main = `<div class="countdown-num">${L.countdown}</div>`;
    if (_lastCountdown !== L.countdown) { _lastCountdown = L.countdown; playSound('tick'); }
  } else if (!q) {
    main = `<div class="pres-idle"><div class="big">بانتظار بدء المنافسة</div>
      <p class="muted" style="margin-top:1rem;font-size:1.1rem">${esc(state.event.slogan)}</p></div>`;
  } else {
    const isOpen = q.format === 'open' || q.format === 'quick';
    const isChoice = q.choices && q.choices.length && !isOpen;
    const clickable = state.settings.allowPresenterClick && !L.answerLocked && !L.scored &&
                      !L.timeUp && L.timer.running && L.teamId && timerRemaining() > 0;
    const isTimeUp = L.timeUp || (!L.timer.running && rem <= 0 && !L.answerLocked && L.status === 'question');
    main = `
      <div class="row" style="gap:.7rem;margin-bottom:.3rem">
        <span class="badge gold" style="font-size:.9rem;padding:.35rem .9rem">${q.points} نقطة</span>
        <span class="badge purple" style="font-size:.9rem;padding:.35rem .9rem">${esc(q.category)}</span>
        ${L.doubleTeam ? `<span class="badge" style="font-size:.9rem;padding:.35rem .9rem">✖️2 ${esc((getTeam(L.doubleTeam)||{}).name||'')}</span>` : ''}
        ${L.answerLocked ? `<span class="badge ok" style="font-size:.9rem;padding:.35rem .9rem">🎯 ${esc((answerTeam||{}).name||'')}</span>` : ''}
      </div>
      <div class="pres-q">${esc(q.text)}</div>
      ${q.image ? `<img src="${esc(q.image)}" style="max-height:32vh;border-radius:18px;border:1px solid var(--line2)">` : ''}
      ${isChoice ? `<div class="pres-choices">
        ${q.choices.map((c, i) => {
          const isCorrect = i === q.correctIndex;
          const cls = L.revealed && isCorrect ? 'correct' : (L.hiddenChoices.includes(i) ? 'hidden' : '');
          const selected = L.answerLocked && L.selectedChoice === i;
          return `<div class="pres-choice ${cls} ${selected ? 'selected' : ''}"
                       style="animation-delay:${i * .07}s"
                       ${clickable ? `data-clickable="1" onclick="App.presentSelect(${i})"` : ''}>
            <span class="kk">${'أبجدهو'[i] || i + 1}</span><span>${esc(c)}</span>
            ${selected ? '<span style="margin-right:auto;font-size:.75em;color:#ffd977">🎯</span>' : ''}
          </div>`;
        }).join('')}
      </div>` : ''}
      ${L.revealed && isOpen ? `<div class="pres-choice correct" style="max-width:800px">
         <span class="kk">✓</span><span>${esc(q.correctText || '')}</span></div>` : ''}
      ${L.revealed && q.explanation ? `<div style="max-width:1100px;text-align:center;font-size:1.05rem;color:#a9d8ff;line-height:1.7">💡 ${esc(q.explanation)}</div>` : ''}
      ${isTimeUp && !L.revealed ? `<div class="timeup-msg">⏰ انتهى الوقت!</div>` : ''}
      <div style="display:flex;align-items:center;gap:1.2rem;margin-top:.3rem">
        <div class="pres-timer ${rem <= 10 && rem > 0 && L.timer.running ? 'low' : ''}" data-timer-num>${fmtTime(rem)}</div>
      </div>
      <div style="width:min(680px,90%);height:10px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden">
        <i data-timer-bar style="display:block;height:100%;border-radius:99px;
          background:linear-gradient(90deg,#28e0ff,#3b6bff);box-shadow:0 0 16px rgba(40,224,255,.6);
          width:${clamp(rem / (L.timer.total || 1) * 100, 0, 100)}%"></i>
      </div>`;
  }

  const bar = `
  <div class="pres-scorebar">
    ${teams.map(t => `<div class="pscore ${lead && t.id === lead.id && teams.length > 1 ? 'lead' : ''} ${L.teamId === t.id && L.status === 'question' ? 'answering' : ''}" style="--tc:${esc(t.color)}">
      <img src="${esc(t.logo)}" alt=""><div><div class="n">${esc(t.name)}</div></div>
      <div class="s">${t.score}</div></div>`).join('')}
  </div>`;

  el.innerHTML = `${top}<div class="pres-main">${main}</div>${bar}${fxHTML}
    <button class="btn sm ghost fs-btn" onclick="App.toggleFullscreen()">⛶</button>`;
}

function renderResultsHTML() {
